<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Description | default (.Summary | plainify) | default site.Params.description }}">
<meta property="og:url" content="{{ partial "canonical_url.html" . }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:locale" content="zh_CN">
<meta property="og:image" content="{{ partial "share_image.html" . }}">
{{ if and .IsPage (eq .Section "posts") }}
<meta property="og:type" content="article">
<meta property="article:published_time" content="{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{ else }}<meta property="og:type" content="website">{{ end }}
