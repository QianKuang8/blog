{{- if gt .TotalPages 1 }}
<nav class="bc-pagination" aria-label="文章分页">
  <div>
    {{- if .HasPrev }}<a href="{{ .Prev.URL }}" rel="prev">← 上一页</a>{{ end }}
  </div>
  <span>第 {{ .PageNumber }} / {{ .TotalPages }} 页</span>
  <div>
    {{- if .HasNext }}<a href="{{ .Next.URL }}" rel="next">下一页 →</a>{{ end }}
  </div>
</nav>
{{- end -}}
