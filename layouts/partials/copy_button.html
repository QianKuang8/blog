{{- /* A small icon button that copies "title URL" for pasting into a chat. Hidden until
  site.js finds the Clipboard API. Takes dict: text, label, icon ("copy" or "link"). */ -}}
<button type="button" class="bc-copy" data-copy="{{ .text }}" aria-label="{{ .label }}" title="{{ .label }}" hidden>
  {{- if eq .icon "link" -}}
  <svg class="bc-icon-copy" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.3-2.3a2.6 2.6 0 0 0-3.7-3.7l-.9.9M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.4 8.9a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></svg>
  {{- else -}}
  <svg class="bc-icon-copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V4A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/></svg>
  {{- end -}}
  <svg class="bc-icon-done" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>
</button>
{{- /**/ -}}
