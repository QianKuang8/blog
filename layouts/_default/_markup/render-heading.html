<h{{ .Level }} id="{{ .Anchor }}"{{ range $name, $value := .Attributes }}{{ if ne $name "id" }}{{ printf " %s=%q" $name ($value | string) | safeHTMLAttr }}{{ end }}{{ end }}>{{ .Text | safeHTML }}{{ if not (.Page.Param "disableAnchoredHeadings") }}<a class="anchor bc-heading-anchor" href="#{{ .Anchor }}" data-heading-anchor aria-label="复制“{{ .Text | plainify }}”的标题链接" title="复制标题链接">#</a>{{ end }}</h{{ .Level }}>
