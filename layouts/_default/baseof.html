<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>{{ partial "head.html" . }}</head>
<body id="top"{{ if and .IsPage (eq .Section "posts") }} data-reading-page{{ end }}>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <div class="bc-layout">
    {{ partial "sidebar.html" . }}
    <main class="bc-main" id="main-content">
      {{ block "main" . }}{{ end }}
      {{ partial "footer.html" . }}
    </main>
  </div>
  {{ $script := resources.Get "js/site.js" | minify | fingerprint }}
  <script defer src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" crossorigin="anonymous"></script>
</body>
</html>
