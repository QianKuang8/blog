baseURL: https://qiankuang8.github.io/blog/
defaultContentLanguage: zh
title: Qian's blog
pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
capitalizeListTitles: false
disableKinds: ["rss"]

markup:
  goldmark:
    renderer:
      unsafe: true # reading_path and other shortcodes emit HTML
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - JSON # search index

params:
  contentEditURL: "https://github.com/QianKuang8/blog/edit/main/content"
  description: "Qian 的个人博客，记录 AI 工程、Coding Agent、Context Engineering 和软件工程实践。"
  author: Qian
  images: ["site-card.png"]
  DateFormat: "2006-01-02"
  ShowReadingTime: true

  fuseOpts:
    threshold: 0.3
    minMatchCharLength: 1
    keys:
      - name: title
        weight: 0.45
      - name: summary
        weight: 0.25
      - name: content
        weight: 0.15
      - name: tags
        weight: 0.15

  homeInfoParams:
    Content: "记录 AI 工程、Coding Agent、Context Engineering 和一些个人折腾。"

  schema:
    sameAs:
      - "https://github.com/QianKuang8"
