baseURL: https://qiankuang8.github.io/blog/
defaultContentLanguage: zh
languageCode: zh-CN
title: Qian's Blog
pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
capitalizeListTitles: false
disableKinds: ["rss"]

markup:
  goldmark:
    renderer:
      unsafe: true # reading_path and other shortcodes emit HTML
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - JSON # search index

params:
  contentEditURL: "https://github.com/QianKuang8/blog/edit/main/content"
  description: "Qian 的个人博客，记录 AI 工程、Coding Agent、Context Engineering 和软件工程实践。"
  author: Qian
  images: ["site-card.png"]
  DateFormat: "2006-01-02"
  ShowReadingTime: true

  homeInfoParams:
    Content: "记录 AI 工程、Coding Agent、Context Engineering 和一些个人折腾。"

  schema:
    sameAs:
      - "https://github.com/QianKuang8"

# static/images is also an asset source so the image render hook can make
# display-sized WebP copies; the original files are still published unchanged.
module:
  mounts:
    - source: assets
      target: assets
    - source: static/images
      target: assets/images
