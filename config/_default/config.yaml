baseURL: https://qiankuang8.github.io/blog/
defaultContentLanguage: zh
copyright: "© [Qian](https://github.com/QianKuang8) 2024"
title: Qian's blog
theme: ["PaperMod"]
pagination:
  pagerSize: 10

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

minify:
  disableXML: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

menu:
  main:
    - name: 首页
      url: /
      weight: 10
    - name: 栏目
      url: categories/
      weight: 20
    - name: 专题
      url: topics/
      weight: 30
    - name: 标签
      url: tags
      weight: 40
    - name: 归档
      url: archives/
      weight: 50
    - name: 搜索
      url: search/
      weight: 60
    - name: Github
      url: https://github.com/QianKuang8
      weight: 70

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Qian's blog
  description: "Qian 的个人博客，记录 AI 工程、Coding Agent、Context Engineering 和软件工程实践。"
  # keywords: [Blog, Portfolio, PaperMod]
  author: Qian
  images: ["site-card.png"]
  DateFormat: "2006-01-02"

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  homeInfoParams:
    Title: "Qian's Blog"
    # imageUrl: "images/something"
    # imageTitle: "title"
    # imageWidth: 240
    # imageHeight: 240
    Content: |
      记录 AI 工程、Coding Agent、Context Engineering 和一些个人折腾。

      按内容浏览：

      - [好文分享](categories/好文分享/)
      - [原创文章](categories/原创文章/)
      - [视频笔记](categories/视频笔记/)

      按主题阅读：

      - [Coding Agent](/blog/topics/coding-agent/)
      - [Context Engineering](/blog/topics/context-engineering/)
      - [Harness Engineering](/blog/topics/harness-engineering/)

  schema:
    publisherType: Person
    sameAs:
      - "https://github.com/QianKuang8"

  # socialIcons:
  #   - name: github
  #     title: View Source on Github
  #     url: "https://github.com/adityatelange/hugo-PaperMod"
