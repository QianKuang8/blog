<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="778" viewBox="0 0 1000 778" role="img" aria-labelledby="title desc">
  <title id="title">一次文件编辑要经过三次转换</title>
  <desc id="desc">三张卡片从左到右：模型把修改意图写成文本协议，需要写清改哪个文件、目标在哪里、保留与替换的边界，可能因格式无法解析而失败；工具解析协议并在当前文件中定位、替换，可能因目标片段不匹配而失败，原文中 Codex、Aider 先精确再放宽匹配，RooCode 从预期位置向外找候选并保留缩进，OpenHands 与 Cursor 也可由另一个模型完成合并；工具再把执行结果反馈给模型，应说明哪个块没有匹配、当前文件中的相似行和其他块是否已应用，否则部分成功后重试会重复执行。反馈箭头回到第一张卡片，进入下一轮。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50647a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="778" rx="20" fill="#f5f7fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="50" font-size="27" font-weight="700" fill="#182b40">一次文件编辑要经过三次转换</text>
    <text x="40" y="86" font-size="19" fill="#526478">模型写出协议，工具落到文件，结果再回到模型；每一步都有自己的失败方式</text>
    <g font-size="16" fill="#526478">
      <rect x="40" y="104" width="16" height="16" rx="3" fill="#e9f0fb" stroke="#a9bfdc"/>
      <text x="64" y="118">由模型完成</text>
      <rect x="184" y="104" width="16" height="16" rx="3" fill="#e7f4ee" stroke="#a3cdbb"/>
      <text x="208" y="118">由工具完成</text>
      <rect x="328" y="104" width="16" height="16" rx="3" fill="#fff4df" stroke="#d9c397"/>
      <text x="352" y="118">这一步可能的失败</text>
    </g>
    <rect x="40" y="140" width="280" height="536" rx="14" fill="#fff" stroke="#c8d2de"/>
    <rect x="360" y="140" width="280" height="536" rx="14" fill="#fff" stroke="#c8d2de"/>
    <rect x="680" y="140" width="280" height="536" rx="14" fill="#fff" stroke="#c8d2de"/>
    <g fill="none" stroke="#50647a" stroke-width="1.7">
      <path d="M324 182 H352" marker-end="url(#arrow)"/>
      <path d="M644 182 H672" marker-end="url(#arrow)"/>
      <path d="M820 678 V704 H180 V684" marker-end="url(#arrow)"/>
    </g>
    <rect x="288.0" y="689" width="424" height="30" rx="15" fill="#f5f7fa"/>
    <text x="500" y="710" text-anchor="middle" font-size="16" fill="#344d68">反馈进入下一轮：重读文件、调整锚点或缩小修改范围</text>
    <g>
      <rect x="56" y="156" width="248" height="52" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
      <text x="70" y="189" font-size="19" font-weight="700" fill="#254d7a">① 意图 → 文本协议</text>
      <text x="58" y="232" font-size="16" fill="#526478">模型写出，需要写清</text>
      <text x="58" y="264" font-size="17" fill="#344d68">· 改哪个文件</text>
      <text x="58" y="292" font-size="17" fill="#344d68">· 目标在哪里</text>
      <text x="58" y="320" font-size="17" fill="#344d68">· 保留与替换的边界</text>
      <rect x="56" y="340" width="248" height="44" rx="8" fill="#fff4df" stroke="#d9c397"/>
      <text x="70" y="368" font-size="17" fill="#725025">格式无法解析</text>
      <path d="M56 404 H304" stroke="#e1e7ee" stroke-width="1.5"/>
      <text x="58" y="432" font-size="16" font-weight="700" fill="#526478">定位依据</text>
      <text x="58" y="460" font-size="16" fill="#526478">行号：直接，易随文件变化失效</text>
      <text x="58" y="486" font-size="16" fill="#526478">上下文：抗移动，可能重复或过时</text>
      <text x="58" y="524" font-size="16" font-weight="700" fill="#526478">原文示例</text>
      <text x="58" y="552" font-size="16" fill="#526478">Codex：@@ 附近代码 + 增删行</text>
      <text x="58" y="578" font-size="16" fill="#526478">Aider：搜索替换给出新旧块</text>
    </g>
    <g>
      <rect x="376" y="156" width="248" height="52" rx="8" fill="#e7f4ee" stroke="#a3cdbb"/>
      <text x="390" y="189" font-size="19" font-weight="700" fill="#21624a">② 协议 → 文件操作</text>
      <text x="378" y="232" font-size="16" fill="#526478">工具解析后执行，需要</text>
      <text x="378" y="264" font-size="17" fill="#344d68">· 读取当前文件</text>
      <text x="378" y="292" font-size="17" fill="#344d68">· 定位目标片段</text>
      <text x="378" y="320" font-size="17" fill="#344d68">· 替换并保留格式</text>
      <rect x="376" y="340" width="248" height="44" rx="8" fill="#fff4df" stroke="#d9c397"/>
      <text x="390" y="368" font-size="17" fill="#725025">目标片段不匹配</text>
      <path d="M376 404 H624" stroke="#e1e7ee" stroke-width="1.5"/>
      <text x="378" y="432" font-size="16" font-weight="700" fill="#526478">原文示例</text>
      <text x="378" y="460" font-size="16" fill="#526478">Codex、Aider：先精确匹配，</text>
      <text x="378" y="486" font-size="16" fill="#526478">再放宽空白或缩进</text>
      <text x="378" y="518" font-size="16" fill="#526478">RooCode：从预期位置向外找，</text>
      <text x="378" y="544" font-size="16" fill="#526478">按相似度评分并保留缩进</text>
      <rect x="376" y="566" width="248" height="92" rx="8" fill="#e9f0fb" stroke="#a9bfdc" stroke-dasharray="5 4"/>
      <text x="390" y="594" font-size="16" fill="#254d7a">或由另一个模型完成合并</text>
      <text x="390" y="618" font-size="16" fill="#254d7a">OpenHands draft editor</text>
      <text x="390" y="642" font-size="16" fill="#254d7a">Cursor Apply 模型</text>
    </g>
    <g>
      <rect x="696" y="156" width="248" height="52" rx="8" fill="#e7f4ee" stroke="#a3cdbb"/>
      <text x="710" y="189" font-size="19" font-weight="700" fill="#21624a">③ 执行结果 → 反馈</text>
      <text x="698" y="232" font-size="16" fill="#526478">工具反馈给模型，应说明</text>
      <text x="698" y="264" font-size="17" fill="#344d68">· 哪个块没有匹配</text>
      <text x="698" y="292" font-size="17" fill="#344d68">· 当前文件中的相似行</text>
      <text x="698" y="320" font-size="17" fill="#344d68">· 其他块是否已经应用</text>
      <rect x="696" y="340" width="248" height="44" rx="8" fill="#fff4df" stroke="#d9c397"/>
      <text x="710" y="368" font-size="17" fill="#725025">部分成功后重试，重复执行</text>
      <path d="M696 404 H944" stroke="#e1e7ee" stroke-width="1.5"/>
      <text x="698" y="432" font-size="16" font-weight="700" fill="#526478">原文示例</text>
      <text x="698" y="460" font-size="16" fill="#526478">Aider 的报告包含上面三项，</text>
      <text x="698" y="486" font-size="16" fill="#526478">并要求只重发失败的块</text>
      <text x="698" y="524" font-size="16" font-weight="700" fill="#526478">落盘之后</text>
      <text x="698" y="552" font-size="16" fill="#526478">文件变化不等于需求实现，</text>
      <text x="698" y="578" font-size="16" fill="#526478">仍需 diff 审查、运行或测试</text>
    </g>
    <text x="500" y="754" text-anchor="middle" font-size="16" fill="#64758a">依据 Code Surgery 原文与正文整理；失败与阶段的对应、各系统所在位置为编者归纳</text>
  </g>
</svg>
