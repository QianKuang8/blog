<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1152" viewBox="0 0 1200 1152" role="img" aria-labelledby="title desc">
<title id="title">旧方法压缩后：长过程被较小的交接材料替换</title><desc id="desc">同一 Session 继续，容量上限不变；整理输入以后，窗口腾出空间。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526479"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#17283c}</style>
<rect width="1200" height="1152" rx="24" fill="#f8fafc"/>
<text x="44" y="38" font-size="18" font-weight="650" text-anchor="start" style="fill:#526479">图 03</text>
<text x="44" y="85" font-size="32" font-weight="700" text-anchor="start" style="fill:#17283c">旧方法压缩后：长过程被较小的交接材料替换</text>
<text x="44" y="124" font-size="22" font-weight="400" text-anchor="start" style="fill:#526479">同一 Session 继续，容量上限不变；整理输入以后，窗口腾出空间。</text>
<rect x="52" y="158" width="19" height="19" rx="5" fill="#e9eef4" stroke="#516275"/>
<text x="80" y="175" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">System prompt 基础指令</text>
<rect x="460" y="158" width="19" height="19" rx="5" fill="#e8f1ff" stroke="#3263ab"/>
<text x="488" y="175" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">User 用户要求</text>
<rect x="790" y="158" width="19" height="19" rx="5" fill="#e9f6ed" stroke="#23775b"/>
<text x="818" y="175" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">Assistant 模型回复</text>
<rect x="52" y="200" width="19" height="19" rx="5" fill="#fff0df" stroke="#a75d20"/>
<text x="80" y="217" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">Tool call 工具调用</text>
<rect x="460" y="200" width="19" height="19" rx="5" fill="#f2ebff" stroke="#7050a1"/>
<text x="488" y="217" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">Tool result 工具返回</text>
<path d="M794 210 L839 210" fill="none" stroke="#526479" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="852" y="217" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">任务推进 / Next</text>
<rect x="44" y="264" width="1112" height="780" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
<text x="68" y="306" font-size="25" font-weight="700" text-anchor="start" style="fill:#17283c">同一 Session（一次持续任务）：修复上传取消问题</text>
<text x="68" y="347" font-size="23" font-weight="650" text-anchor="start" style="fill:#17283c">压缩前：多轮消息和工具结果</text>
<text x="68" y="373" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">模型当前可读上下文</text>
<rect x="68" y="388" width="464" height="560" rx="18" fill="#fcfdff" stroke="#cbd5e1"/>
<path d="M69 886 H531 V930 Q531 947 514 947 H86 Q69 947 69 930 Z" fill="#fff5e6"/>
<text x="83" y="911" font-size="20" font-weight="400" text-anchor="start" style="fill:#986020">预留生成空间</text>
<path d="M69 948 H531" fill="none" stroke="#986020" stroke-width="3"/>
<text x="518" y="936" font-size="20" font-weight="400" text-anchor="end" style="fill:#986020">容量上限 / Limit</text>
<rect x="80" y="401" width="440" height="38" rx="18" fill="#e9eef4" stroke="#cbd5e1"/>
<text x="93" y="427" font-size="20" font-weight="600" text-anchor="start" style="fill:#516275">System prompt 基础指令</text>
<rect x="80" y="446" width="440" height="38" rx="18" fill="#e8f1ff" stroke="#cbd5e1"/>
<text x="93" y="472" font-size="20" font-weight="600" text-anchor="start" style="fill:#3263ab">User 用户要求</text>
<rect x="80" y="491" width="440" height="38" rx="18" fill="#e9f6ed" stroke="#cbd5e1"/>
<text x="93" y="517" font-size="20" font-weight="600" text-anchor="start" style="fill:#23775b">Assistant 模型回复</text>
<rect x="80" y="536" width="440" height="38" rx="18" fill="#fff0df" stroke="#cbd5e1"/>
<text x="93" y="562" font-size="20" font-weight="600" text-anchor="start" style="fill:#a75d20">Tool call 工具调用</text>
<rect x="80" y="581" width="440" height="112" rx="18" fill="#f2ebff" stroke="#cbd5e1"/>
<text x="93" y="607" font-size="20" font-weight="600" text-anchor="start" style="fill:#7050a1">Tool result 工具返回</text>
<text x="93" y="634" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">多次读入的大段代码</text>
<text x="93" y="661" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">与排查日志……</text>
<rect x="80" y="700" width="440" height="38" rx="18" fill="#e9f6ed" stroke="#cbd5e1"/>
<text x="93" y="726" font-size="20" font-weight="600" text-anchor="start" style="fill:#23775b">Assistant 模型回复</text>
<rect x="80" y="745" width="440" height="38" rx="18" fill="#fff0df" stroke="#cbd5e1"/>
<text x="93" y="771" font-size="20" font-weight="600" text-anchor="start" style="fill:#a75d20">Tool call 工具调用</text>
<rect x="80" y="790" width="440" height="75" rx="18" fill="#f2ebff" stroke="#cbd5e1"/>
<text x="93" y="816" font-size="20" font-weight="600" text-anchor="start" style="fill:#7050a1">Tool result 工具返回</text>
<text x="93" y="843" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">测试输出与更多日志……</text>
<text x="668" y="347" font-size="23" font-weight="650" text-anchor="start" style="fill:#17283c">刚压缩后：较小的输入</text>
<text x="668" y="373" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">模型当前可读上下文</text>
<rect x="668" y="388" width="464" height="560" rx="18" fill="#fcfdff" stroke="#cbd5e1"/>
<path d="M669 886 H1131 V930 Q1131 947 1114 947 H686 Q669 947 669 930 Z" fill="#fff5e6"/>
<text x="683" y="911" font-size="20" font-weight="400" text-anchor="start" style="fill:#986020">预留生成空间</text>
<path d="M669 948 H1131" fill="none" stroke="#986020" stroke-width="3"/>
<text x="1118" y="936" font-size="20" font-weight="400" text-anchor="end" style="fill:#986020">容量上限 / Limit</text>
<rect x="680" y="401" width="440" height="38" rx="18" fill="#e9eef4" stroke="#cbd5e1"/>
<text x="693" y="427" font-size="20" font-weight="600" text-anchor="start" style="fill:#516275">System prompt 基础指令</text>
<rect x="680" y="446" width="440" height="38" rx="18" fill="#e8f1ff" stroke="#cbd5e1"/>
<text x="693" y="472" font-size="20" font-weight="600" text-anchor="start" style="fill:#3263ab">User 保留的用户要求</text>
<rect x="680" y="491" width="440" height="76" rx="18" fill="#fff6d9" stroke="#cbd5e1"/>
<text x="693" y="519" font-size="20" font-weight="650" text-anchor="start" style="fill:#86671d">交接材料</text>
<text x="693" y="546" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">目标、约束、进度与下一步</text>
<rect x="680" y="582" width="440" height="292" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 7"/>
<text x="900.0" y="735.0" font-size="22" font-weight="400" text-anchor="middle" style="fill:#6f8193">供后续工作使用</text>
<path d="M543 650 L652 650" fill="none" stroke="#526479" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600" y="622" font-size="21" font-weight="400" text-anchor="middle" style="fill:#17283c">压缩替换</text>
<text x="68" y="986" font-size="21" font-weight="400" text-anchor="start" style="fill:#526479">原有分析、代码片段和日志，不再全部随请求带入。</text>
<text x="668" y="986" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">之后产生的新回复、调用和结果，再逐步占用空白。</text>
<text x="44" y="1094" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">图示以文字摘要路径为例；交接材料也可能是压缩状态，消息保留规则因路径而异。</text>
<text x="44" y="1124" font-size="20" font-weight="400" text-anchor="start" style="fill:#526479">原始过程退出当前输入，不代表历史日志中的原记录被删除。</text>
</svg>
