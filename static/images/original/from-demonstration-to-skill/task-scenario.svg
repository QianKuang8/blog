<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">任务场景：每周把周报金额填入数据后台</title>
  <desc id="desc">上半部分展示本周的完整任务：用户在九月周报中找到本周金额四万二千六百八十元，复制到浏览器的数据后台，在经营数据页面填写本周金额，提交并看到成功提示。下半部分展示下周的变化：金额变成四万三千二百一十元，数据所在行和网页字段的位置可能移动，但任务目标仍然是找到本周金额、填写并提交。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 740; }
      .subtitle { font-size: 20px; fill: #475569; }
      .section { font-size: 18px; font-weight: 720; }
      .window-title { font-size: 18px; font-weight: 700; }
      .panel-title { font-size: 22px; font-weight: 740; }
      .body { font-size: 17px; fill: #334155; }
      .small { font-size: 15px; fill: #64748b; }
      .micro { font-size: 13px; fill: #64748b; }
      .cell { font-size: 16px; fill: #334155; }
      .value { font-size: 22px; font-weight: 760; }
      .chip { font-size: 14px; font-weight: 700; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .arrowhead { fill: #64748b; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f8fafc"/>

  <text class="text title" x="720" y="58" text-anchor="middle">先看任务：每周把周报金额填进数据后台</text>
  <text class="text subtitle" x="720" y="94" text-anchor="middle">这周演示一次；下周数字和页面可能变化，但要完成的事不变</text>

  <!-- Current run -->
  <rect x="70" y="119" width="100" height="30" rx="15" fill="#ffedd5"/>
  <text class="text section" x="120" y="140" text-anchor="middle" style="fill:#c2410c">这周</text>
  <text class="text body" x="188" y="140">用户亲自完成一次</text>

  <!-- Spreadsheet window -->
  <rect x="70" y="164" width="470" height="350" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <path d="M70 186 Q70 164 92 164 H518 Q540 164 540 186 V214 H70 Z" fill="#f1f5f9"/>
  <circle cx="96" cy="189" r="6" fill="#f87171"/>
  <circle cx="116" cy="189" r="6" fill="#fbbf24"/>
  <circle cx="136" cy="189" r="6" fill="#34d399"/>
  <rect x="167" y="176" width="194" height="26" rx="13" fill="#ffffff" stroke="#dbe3ee"/>
  <text class="text window-title" x="264" y="195" text-anchor="middle">九月周报</text>

  <rect x="70" y="214" width="106" height="300" fill="#f8fafc"/>
  <text class="text small" x="94" y="247">工作表</text>
  <rect x="83" y="265" width="80" height="34" rx="9" fill="#dcfce7"/>
  <text class="text body" x="123" y="287" text-anchor="middle">周报</text>

  <rect x="196" y="238" width="320" height="232" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="196" y="238" width="320" height="40" fill="#f1f5f9"/>
  <line class="grid" x1="332" y1="238" x2="332" y2="470"/>
  <line class="grid" x1="196" y1="278" x2="516" y2="278"/>
  <line class="grid" x1="196" y1="326" x2="516" y2="326"/>
  <line class="grid" x1="196" y1="374" x2="516" y2="374"/>
  <line class="grid" x1="196" y1="422" x2="516" y2="422"/>
  <text class="text small" x="264" y="264" text-anchor="middle">指标</text>
  <text class="text small" x="424" y="264" text-anchor="middle">数值</text>
  <text class="text cell" x="216" y="308">订单数</text>
  <text class="text cell" x="352" y="308">128</text>
  <rect x="332" y="326" width="184" height="48" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <rect x="510" y="368" width="8" height="8" fill="#10b981"/>
  <text class="text cell" x="216" y="356">本周金额</text>
  <text class="text value" x="352" y="358">42,680</text>
  <text class="text cell" x="216" y="404">退款金额</text>
  <text class="text cell" x="352" y="404">1,260</text>
  <text class="text cell" x="216" y="452">备注</text>
  <text class="text cell" x="352" y="452">已核对</text>

  <rect x="204" y="482" width="122" height="24" rx="12" fill="#d1fae5"/>
  <text class="text chip" x="265" y="499" text-anchor="middle" style="fill:#047857">① 找到并复制</text>

  <!-- Clipboard transfer -->
  <path class="arrow" d="M540 338 H562"/>
  <path class="arrowhead" d="M562 331 L574 338 L562 345 Z"/>
  <rect x="585" y="286" width="170" height="104" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2" filter="url(#shadow)"/>
  <rect x="642" y="274" width="56" height="24" rx="9" fill="#fed7aa" stroke="#fb923c"/>
  <text class="text small" x="670" y="320" text-anchor="middle">剪贴板</text>
  <text class="text value" x="670" y="355" text-anchor="middle">42,680</text>
  <path class="arrow" d="M755 338 H768"/>
  <path class="arrowhead" d="M768 331 L780 338 L768 345 Z"/>

  <!-- Browser window -->
  <rect x="790" y="164" width="580" height="350" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <path d="M790 186 Q790 164 812 164 H1348 Q1370 164 1370 186 V214 H790 Z" fill="#f1f5f9"/>
  <circle cx="816" cy="189" r="6" fill="#f87171"/>
  <circle cx="836" cy="189" r="6" fill="#fbbf24"/>
  <circle cx="856" cy="189" r="6" fill="#34d399"/>
  <rect x="890" y="176" width="332" height="26" rx="13" fill="#ffffff" stroke="#dbe3ee"/>
  <text class="text small" x="1056" y="194" text-anchor="middle">data.example.com / operation</text>

  <rect x="790" y="214" width="138" height="300" fill="#f8fafc"/>
  <text class="text window-title" x="818" y="247">数据后台</text>
  <text class="text small" x="818" y="287">概览</text>
  <rect x="805" y="306" width="108" height="38" rx="10" fill="#dbeafe"/>
  <text class="text body" x="859" y="331" text-anchor="middle" style="fill:#1d4ed8">经营数据</text>
  <text class="text small" x="818" y="375">订单</text>
  <text class="text small" x="818" y="411">设置</text>

  <text class="text panel-title" x="965" y="259">经营数据</text>
  <text class="text small" x="965" y="286">填写并提交本周经营数据</text>
  <text class="text body" x="965" y="326">本周金额</text>
  <rect x="965" y="342" width="350" height="48" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
  <text class="text value" x="983" y="373">42,680</text>
  <rect x="1212" y="353" width="84" height="26" rx="13" fill="#dbeafe"/>
  <text class="text chip" x="1254" y="371" text-anchor="middle" style="fill:#1d4ed8">② 填写</text>
  <text class="text body" x="965" y="424">所属部门</text>
  <rect x="965" y="438" width="196" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="text body" x="983" y="465">市场部</text>
  <rect x="1180" y="429" width="135" height="51" rx="12" fill="#2563eb"/>
  <text class="text window-title" x="1247.5" y="461" text-anchor="middle" style="fill:#ffffff">③ 提交</text>

  <rect x="1112" y="490" width="226" height="48" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1140" cy="514" r="13" fill="#10b981"/>
  <path d="M1134 514 L1139 519 L1147 509" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text window-title" x="1164" y="520" style="fill:#047857">④ 提交成功</text>

  <!-- Next week -->
  <rect x="70" y="566" width="1290" height="270" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96" y="589" width="100" height="30" rx="15" fill="#e0f2fe"/>
  <text class="text section" x="146" y="610" text-anchor="middle" style="fill:#0369a1">下周</text>
  <text class="text body" x="214" y="610">数据变了，位置也可能变</text>
  <rect x="850" y="586" width="476" height="38" rx="19" fill="#ecfdf5"/>
  <text class="text section" x="1088" y="612" text-anchor="middle" style="fill:#047857">目标不变：找到“本周金额”，填写并提交</text>

  <!-- Changed source -->
  <rect x="100" y="646" width="365" height="148" rx="17" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="100" y="646" width="365" height="36" rx="17" fill="#f1f5f9"/>
  <path d="M100 665 Q100 646 119 646 H446 Q465 646 465 665 V682 H100 Z" fill="#f1f5f9"/>
  <text class="text window-title" x="124" y="671">九月周报</text>
  <text class="text micro" x="437" y="671" text-anchor="end">下一周</text>
  <text class="text cell" x="126" y="713">新增用户</text>
  <text class="text cell" x="348" y="713">86</text>
  <text class="text cell" x="126" y="746">退款金额</text>
  <text class="text cell" x="348" y="746">980</text>
  <rect x="116" y="758" width="325" height="48" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <text class="text cell" x="132" y="789">本周金额</text>
  <text class="text value" x="326" y="791">43,210</text>
  <rect x="111" y="630" width="86" height="26" rx="13" fill="#d1fae5"/>
  <text class="text chip" x="154" y="648" text-anchor="middle" style="fill:#047857">新金额</text>

  <path class="arrow" d="M465 720 H562"/>
  <path class="arrowhead" d="M562 713 L574 720 L562 727 Z"/>
  <text class="text value" x="525" y="701" text-anchor="middle">43,210</text>

  <!-- Changed destination layout -->
  <rect x="585" y="646" width="530" height="160" rx="17" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="585" y="646" width="530" height="36" rx="17" fill="#f1f5f9"/>
  <path d="M585 665 Q585 646 604 646 H1096 Q1115 646 1115 665 V682 H585 Z" fill="#f1f5f9"/>
  <text class="text window-title" x="609" y="671">数据后台 · 经营数据</text>
  <rect x="983" y="630" width="108" height="26" rx="13" fill="#dbeafe"/>
  <text class="text chip" x="1037" y="648" text-anchor="middle" style="fill:#1d4ed8">字段移位</text>
  <text class="text small" x="610" y="713">所属部门</text>
  <rect x="610" y="725" width="188" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="text body" x="626" y="750">市场部</text>
  <text class="text body" x="840" y="713">本周金额</text>
  <rect x="840" y="725" width="244" height="46" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
  <text class="text value" x="858" y="755">43,210</text>
  <rect x="949" y="779" width="135" height="45" rx="11" fill="#2563eb"/>
  <text class="text window-title" x="1016.5" y="808" text-anchor="middle" style="fill:#ffffff">提交</text>

  <path class="arrow" d="M1115 720 H1195"/>
  <path class="arrowhead" d="M1195 713 L1207 720 L1195 727 Z"/>
  <circle cx="1261" cy="720" r="35" fill="#10b981"/>
  <path d="M1244 720 L1256 732 L1279 708" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text body" x="1261" y="779" text-anchor="middle" style="fill:#047857">完成同一个任务</text>

  <text class="text small" x="720" y="864" text-anchor="middle">变化的是数据和界面位置，不变的是“把本周金额填入经营数据并提交”</text>
</svg>
