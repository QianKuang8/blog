<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="955" viewBox="0 0 1080 955" role="img" aria-labelledby="title desc">
  <title id="title">Agent 把本次细节改写成可复用规则</title>
  <desc id="desc">四行映射展示 Agent 如何抽象录制细节：把具体金额改写成本周金额，把具体表格单元格改写成寻找金额位置，把旧页面坐标改写成寻找字段，并把点击提交改写为检查成功提示和记录金额。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 48px; font-weight: 750; }
      .column { font-size: 32px; font-weight: 750; }
      .body { font-size: 32px; font-weight: 700; }
      .step { font-size: 30px; font-weight: 750; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 8; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1080" height="955" fill="#f8fafc"/>
  <text class="text title" x="540" y="60" text-anchor="middle">Agent 把本次细节改写成可复用规则</text>

  <rect x="135" y="105" width="250" height="58" rx="29" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <circle cx="174" cy="134" r="13" fill="#ea580c"/>
  <text class="text column" x="277" y="146" text-anchor="middle" style="fill:#c2410c">本次细节</text>

  <rect x="695" y="105" width="250" height="58" rx="29" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <circle cx="734" cy="134" r="13" fill="#2563eb"/>
  <text class="text column" x="837" y="146" text-anchor="middle" style="fill:#1d4ed8">可复用规则</text>

  <!-- Row 1 -->
  <rect x="40" y="190" width="1000" height="155" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="70" y="215" width="380" height="105" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="120" cy="267.5" r="25" fill="#ffedd5"/>
  <text class="text step" x="120" y="278" text-anchor="middle" style="fill:#c2410c">¥</text>
  <text class="text body" x="300" y="279" text-anchor="middle">42,680</text>
  <path class="arrow" d="M450 267.5 H600"/>
  <path d="M630 267.5 L594 246 V289 Z" fill="#64748b"/>
  <rect x="630" y="215" width="380" height="105" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="680" cy="267.5" r="25" fill="#dbeafe"/>
  <path d="M668 267h24M680 255v24" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text class="text body" x="860" y="279" text-anchor="middle">本周金额</text>

  <!-- Row 2 -->
  <rect x="40" y="370" width="1000" height="155" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="70" y="395" width="380" height="105" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="120" cy="447.5" r="25" fill="#ffedd5"/>
  <path d="M107 435h26v25h-26zM107 443h26M116 435v25M125 435v25" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text class="text body" x="300" y="440" text-anchor="middle">九月周报</text>
  <text class="text body" x="300" y="478" text-anchor="middle">当前单元格</text>
  <path class="arrow" d="M450 447.5 H600"/>
  <path d="M630 447.5 L594 426 V469 Z" fill="#64748b"/>
  <rect x="630" y="395" width="380" height="105" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="680" cy="447.5" r="25" fill="#dbeafe"/>
  <path d="M667 449h26M687 441l8 8-8 8" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text body" x="860" y="459" text-anchor="middle">找到金额所在位置</text>

  <!-- Row 3 -->
  <rect x="40" y="550" width="1000" height="155" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="70" y="575" width="380" height="105" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="120" cy="627.5" r="25" fill="#ffedd5"/>
  <path d="M120 612v31M105 627h30" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="627" r="8" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text class="text body" x="300" y="639" text-anchor="middle">旧页面坐标</text>
  <path class="arrow" d="M450 627.5 H600"/>
  <path d="M630 627.5 L594 606 V649 Z" fill="#64748b"/>
  <rect x="630" y="575" width="380" height="105" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="680" cy="627.5" r="25" fill="#dbeafe"/>
  <path d="M667 619h26v18h-26z" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text class="text body" x="860" y="639" text-anchor="middle">找到“本周金额”字段</text>

  <!-- Row 4 -->
  <rect x="40" y="730" width="1000" height="155" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="70" y="755" width="380" height="105" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="120" cy="807.5" r="25" fill="#ffedd5"/>
  <path d="M109 807.5l8 8 16-20" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text body" x="300" y="819" text-anchor="middle">点击“提交”</text>
  <path class="arrow" d="M450 807.5 H600"/>
  <path d="M630 807.5 L594 786 V829 Z" fill="#64748b"/>
  <rect x="630" y="755" width="380" height="105" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="680" cy="807.5" r="25" fill="#dbeafe"/>
  <path d="M668 807.5l8 8 17-21" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text body" x="860" y="799" text-anchor="middle">提示成功</text>
  <text class="text body" x="860" y="837" text-anchor="middle">记录金额正确</text>
</svg>
