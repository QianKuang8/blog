<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex Agent 读取本地录制文件</title>
  <desc id="desc">示意图展示 Codex Agent 查询录制状态后得到 session.json 和 events.jsonl 的本地路径，再打开文本文件，按顺序读取 selection.changed、window.changed、mouse.click、keyboard.text_input 等事件及其应用、窗口、选区、目标与 AX 快照字段。当前确认的状态和事件结构向 Agent 提供结构化文本，不含图片块；Agent 以后执行任务时仍可使用 Computer Use 查看当前界面。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #475569; }
      .panel-title { font-size: 24px; font-weight: 700; }
      .section-title { font-size: 19px; font-weight: 700; }
      .node-title { font-size: 18px; font-weight: 650; }
      .body { font-size: 17px; fill: #334155; }
      .small { font-size: 15px; fill: #64748b; }
      .micro { font-size: 13px; fill: #64748b; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; fill: #334155; }
      .mono-strong { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 15px; font-weight: 650; fill: #0f172a; }
      .flow { fill: none; stroke: #475569; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .timeline { fill: none; stroke: #93c5fd; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f8fafc"/>

  <text class="text title" x="720" y="54" text-anchor="middle">Codex Agent 读取的是本地录制文件</text>
  <text class="text subtitle" x="720" y="88" text-anchor="middle">状态返回文件路径；Agent 再打开 JSON / JSONL，读取事件与 AX 字段</text>

  <!-- Step 1: query status and receive local paths. -->
  <rect x="42" y="236" width="278" height="336" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="86" cy="282" r="23" fill="#2563eb"/>
  <text class="text node-title" x="86" y="289" text-anchor="middle" style="fill:#ffffff">1</text>
  <text class="text panel-title" x="122" y="290">查询录制状态</text>
  <text class="text body" x="70" y="335">Agent 先取得录制证据的</text>
  <text class="text body" x="70" y="359">本地路径。</text>

  <rect x="70" y="393" width="222" height="60" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="text micro" x="88" y="416">会话信息</text>
  <text class="text mono-strong" x="88" y="440">…/session.json</text>

  <rect x="70" y="469" width="222" height="60" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text class="text micro" x="88" y="492">事件流</text>
  <text class="text mono-strong" x="88" y="516">…/events.jsonl</text>

  <!-- Explicit arrow from paths to file readback. -->
  <path class="flow" d="M320 404 H348"/>
  <path d="M348 393 L368 404 L348 415 Z" fill="#475569"/>
  <rect x="322" y="354" width="52" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="text" x="348" y="371" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#0f172a">打开</text>
  <text class="text" x="348" y="388" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#0f172a">文件</text>

  <!-- Step 2: events.jsonl file view. -->
  <rect x="376" y="122" width="768" height="724" rx="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="376" y="122" width="768" height="78" rx="28" fill="#0f172a"/>
  <path d="M376 161 H1144 V200 H376 Z" fill="#0f172a"/>
  <circle cx="416" cy="161" r="7" fill="#f87171"/>
  <circle cx="438" cy="161" r="7" fill="#fbbf24"/>
  <circle cx="460" cy="161" r="7" fill="#34d399"/>
  <text class="text panel-title" x="492" y="169" style="fill:#ffffff">events.jsonl</text>
  <rect x="983" y="143" width="125" height="36" rx="18" fill="#1e3a8a"/>
  <text class="text small" x="1045.5" y="166" text-anchor="middle" style="fill:#dbeafe;font-weight:700">结构化文本</text>

  <text class="text section-title" x="410" y="237" style="fill:#1d4ed8">按发生顺序保存事件</text>
  <text class="text small" x="410" y="263">每行一条 JSON；下图把四条记录展开，便于阅读。</text>

  <!-- Event timeline. -->
  <line class="timeline" x1="432" y1="307" x2="432" y2="605"/>

  <circle cx="432" cy="319" r="18" fill="#2563eb"/>
  <text class="text small" x="432" y="325" text-anchor="middle" style="fill:#ffffff;font-weight:700">1</text>
  <rect x="468" y="290" width="616" height="66" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="text mono-strong" x="490" y="315">selection.changed</text>
  <text class="text mono" x="490" y="340">app: Numbers   window: 本周明细   selection: B12:B18</text>

  <circle cx="432" cy="401" r="18" fill="#2563eb"/>
  <text class="text small" x="432" y="407" text-anchor="middle" style="fill:#ffffff;font-weight:700">2</text>
  <rect x="468" y="372" width="616" height="66" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="text mono-strong" x="490" y="397">window.changed</text>
  <text class="text mono" x="490" y="422">app: Chrome    window: 周报填报</text>

  <circle cx="432" cy="483" r="18" fill="#2563eb"/>
  <text class="text small" x="432" y="489" text-anchor="middle" style="fill:#ffffff;font-weight:700">3</text>
  <rect x="468" y="454" width="616" height="66" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="text mono-strong" x="490" y="479">mouse.click</text>
  <text class="text mono" x="490" y="504">app: Chrome    target: “本周金额”输入框</text>

  <circle cx="432" cy="565" r="18" fill="#2563eb"/>
  <text class="text small" x="432" y="571" text-anchor="middle" style="fill:#ffffff;font-weight:700">4</text>
  <rect x="468" y="536" width="616" height="66" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="text mono-strong" x="490" y="561">keyboard.text_input</text>
  <text class="text mono" x="490" y="586">target: “本周金额”输入框   text: “42,680”</text>

  <!-- AX fields: modes are fields, not event names. -->
  <rect x="410" y="632" width="700" height="178" rx="20" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <rect x="432" y="650" width="192" height="30" rx="15" fill="#ccfbf1"/>
  <text class="text small" x="528" y="670" text-anchor="middle" style="fill:#0f766e;font-weight:700">事件可附带 AX 快照字段</text>
  <text class="text mono-strong" x="438" y="712">mode</text>
  <rect x="500" y="691" width="122" height="30" rx="8" fill="#ffffff" stroke="#99f6e4"/>
  <text class="text mono" x="561" y="711" text-anchor="middle">fullTree</text>
  <text class="text small" x="632" y="711">首次记录完整控件树</text>
  <rect x="500" y="730" width="182" height="30" rx="8" fill="#ffffff" stroke="#99f6e4"/>
  <text class="text mono" x="591" y="750" text-anchor="middle">diffFromPrevious</text>
  <text class="text small" x="692" y="750">随后只记录变化</text>
  <text class="text mono-strong" x="438" y="789">text</text>
  <text class="text mono" x="500" y="789">“本周金额，文本框”</text>
  <text class="text small" x="735" y="789">可见文字与控件语义</text>

  <!-- Explicit arrow from file readback to Agent. -->
  <path class="flow" d="M1144 446 H1170"/>
  <path d="M1170 435 L1190 446 L1170 457 Z" fill="#475569"/>
  <rect x="1146" y="396" width="50" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="text" x="1171" y="413" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#0f172a">读入</text>
  <text class="text" x="1171" y="430" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#0f172a">上下文</text>

  <!-- Step 3: Agent receives structured text. -->
  <rect x="1198" y="264" width="210" height="338" rx="28" fill="#eef2ff" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1303" cy="328" r="40" fill="#4f46e5"/>
  <circle cx="1289" cy="321" r="4" fill="#ffffff"/>
  <circle cx="1317" cy="321" r="4" fill="#ffffff"/>
  <path d="M1288 341 Q1303 353 1318 341" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text class="text panel-title" x="1303" y="399" text-anchor="middle">Agent</text>
  <text class="text body" x="1303" y="434" text-anchor="middle">读取本地</text>
  <text class="text body" x="1303" y="458" text-anchor="middle">JSON / JSONL</text>
  <rect x="1224" y="486" width="158" height="38" rx="19" fill="#e0e7ff"/>
  <text class="text small" x="1303" y="511" text-anchor="middle" style="fill:#3730a3;font-weight:700">结构化文本输入</text>
  <rect x="1224" y="540" width="158" height="38" rx="19" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="text small" x="1303" y="565" text-anchor="middle" style="fill:#4338ca;font-weight:700">没有图片块</text>

  <!-- Scope note: capture readback versus later execution. -->
  <rect x="1198" y="628" width="210" height="154" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="text section-title" x="1303" y="663" text-anchor="middle" style="fill:#9a3412">这里只描述录制回读</text>
  <text class="text small" x="1220" y="699">以后执行任务时，Agent</text>
  <text class="text small" x="1220" y="723">仍可使用 Computer Use</text>
  <text class="text small" x="1220" y="747">查看当前界面。</text>
</svg>
