<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title desc">
  <title id="title">两套产品怎样生成 Skill</title>
  <desc id="desc">双泳道对比 Claude 与 Codex 的 Skill 生成路径。Claude 从 Cowork 录制证据开始，由 Agent 起草，再由用户审阅并保存或更新。Codex 从本地录制文件开始，由 record-and-replay 指导理解，再由 skill-creator 写入并校验。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 50px; font-weight: 750; }
      .subtitle { font-size: 32px; fill: #475569; }
      .lane { font-size: 34px; font-weight: 750; }
      .node { font-size: 32px; font-weight: 700; }
      .latin { font-size: 30px; font-weight: 700; }
      .arrow { fill: none; stroke-width: 6; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1080" height="690" fill="#f8fafc"/>
  <text class="text title" x="540" y="60" text-anchor="middle">两套产品怎样生成 Skill？</text>
  <text class="text subtitle" x="540" y="108" text-anchor="middle">证据入口不同，生成路径也不同</text>

  <!-- Claude swimlane -->
  <rect x="40" y="145" width="1000" height="230" rx="28" fill="#faf5ff" stroke="#a78bfa" stroke-width="3"/>
  <rect x="70" y="169" width="180" height="48" rx="24" fill="#7c3aed"/>
  <circle cx="99" cy="193" r="12" fill="#ddd6fe"/>
  <text class="text lane" x="121" y="205" style="fill:#ffffff">Claude</text>

  <rect x="70" y="232" width="270" height="112" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="3" filter="url(#shadow)"/>
  <text class="text node" x="205" y="278" text-anchor="middle">Cowork</text>
  <text class="text node" x="205" y="318" text-anchor="middle">录制证据</text>

  <path class="arrow" d="M356 288 H385" stroke="#8b5cf6"/>
  <path d="M405 288 L381 273 V303 Z" fill="#8b5cf6"/>

  <rect x="405" y="232" width="270" height="112" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="461" cy="288" r="25" fill="#ede9fe"/>
  <path d="M451 288l7 7 14-17" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text node" x="574" y="299" text-anchor="middle">Agent 起草</text>

  <path class="arrow" d="M691 288 H720" stroke="#8b5cf6"/>
  <path d="M740 288 L716 273 V303 Z" fill="#8b5cf6"/>

  <rect x="740" y="232" width="270" height="112" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
  <text class="text node" x="875" y="278" text-anchor="middle">用户审阅</text>
  <text class="text latin" x="875" y="318" text-anchor="middle">Save / Update</text>

  <!-- Codex swimlane -->
  <rect x="40" y="405" width="1000" height="230" rx="28" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <rect x="70" y="429" width="165" height="48" rx="24" fill="#059669"/>
  <circle cx="99" cy="453" r="12" fill="#a7f3d0"/>
  <text class="text lane" x="121" y="465" style="fill:#ffffff">Codex</text>

  <rect x="70" y="492" width="270" height="112" rx="20" fill="#ffffff" stroke="#6ee7b7" stroke-width="3" filter="url(#shadow)"/>
  <path d="M170 510h70a9 9 0 0 1 9 9v27a9 9 0 0 1-9 9h-70a9 9 0 0 1-9-9v-27a9 9 0 0 1 9-9z" fill="#d1fae5"/>
  <path d="M179 522h52M179 533h52M179 544h34" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <text class="text node" x="205" y="590" text-anchor="middle">本地录制文件</text>

  <path class="arrow" d="M356 548 H385" stroke="#10b981"/>
  <path d="M405 548 L381 533 V563 Z" fill="#10b981"/>

  <rect x="405" y="492" width="270" height="112" rx="20" fill="#ffffff" stroke="#6ee7b7" stroke-width="3" filter="url(#shadow)"/>
  <text class="text latin" x="540" y="538" text-anchor="middle">record-and-replay</text>
  <text class="text node" x="540" y="578" text-anchor="middle">指导理解</text>

  <path class="arrow" d="M691 548 H720" stroke="#10b981"/>
  <path d="M740 548 L716 533 V563 Z" fill="#10b981"/>

  <rect x="740" y="492" width="270" height="112" rx="20" fill="#d1fae5" stroke="#10b981" stroke-width="3" filter="url(#shadow)"/>
  <text class="text node" x="875" y="538" text-anchor="middle">skill-creator</text>
  <text class="text node" x="875" y="578" text-anchor="middle">写入并校验</text>
</svg>
