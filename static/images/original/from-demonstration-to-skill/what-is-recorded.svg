<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730" role="img" aria-labelledby="title desc">
  <title id="title">录制结束后，Claude 与 Codex 留下的材料有什么不同</title>
  <desc id="desc">同一次周报填报演示结束后，Claude 把动作文字、关键画面、应用信息和可选旁白交给 Agent，形成文字加图片的多模态输入。Codex 把操作事件和辅助功能界面快照写入 JSON 或 JSONL 文件，形成结构化文本输入；AX 字段可使用 fullTree 保存首次完整快照，或使用 diffFromPrevious 保存相对上一次的变化。图中用同一段操作展示两种记录方式。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 720; }
      .subtitle { font-size: 20px; fill: #475569; }
      .panel-title { font-size: 25px; font-weight: 700; }
      .node-title { font-size: 19px; font-weight: 680; }
      .body { font-size: 17px; fill: #334155; }
      .small { font-size: 15px; fill: #64748b; }
      .micro { font-size: 14px; fill: #64748b; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; fill: #334155; }
      .output { font-size: 23px; font-weight: 720; }
      .badge { font-size: 15px; font-weight: 700; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1440" height="730" fill="#f8fafc"/>

  <text class="text title" x="720" y="57" text-anchor="middle">录制结束后，留下了什么？</text>
  <text class="text subtitle" x="720" y="92" text-anchor="middle">同一次演示，留下两类不同的录制证据</text>

  <rect x="465" y="119" width="510" height="82" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="515" cy="160" r="22" fill="#f59e0b"/>
  <path d="M506 160h18M515 151v18" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text class="text node-title" x="558" y="153">演示：把本周金额填入数据后台</text>
  <text class="text body" x="558" y="181">Numbers 读取 42,680 → Chrome 填写并提交</text>

  <path class="arrow" d="M720 201 V226 H373 V240"/>
  <path class="arrow" d="M720 226 H1067 V240"/>
  <path d="M365 240 L373 250 L381 240 Z" fill="#64748b"/>
  <path d="M1059 240 L1067 250 L1075 240 Z" fill="#64748b"/>

  <!-- Claude -->
  <rect x="40" y="254" width="665" height="446" rx="28" fill="#faf5ff" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="254" width="665" height="68" rx="28" fill="#7c3aed"/>
  <path d="M40 294 H705 V322 H40 Z" fill="#7c3aed"/>
  <text class="text panel-title" x="73" y="298" style="fill:#ffffff">Claude：文字 + 图片</text>
  <rect x="541" y="273" width="131" height="32" rx="16" fill="#ede9fe"/>
  <text class="text badge" x="606.5" y="295" text-anchor="middle" style="fill:#6d28d9">多模态材料</text>

  <rect x="72" y="346" width="287" height="198" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="text node-title" x="96" y="383">① 动作文字</text>
  <rect x="255" y="362" width="80" height="28" rx="14" fill="#f3e8ff"/>
  <text class="text micro" x="295" y="381" text-anchor="middle">带时间</text>
  <text class="text mono" x="96" y="423">00:03  在 Numbers 点击 (612,438)</text>
  <text class="text mono" x="96" y="456">00:08  切换到 Chrome</text>
  <text class="text mono" x="96" y="489">00:12  在 Chrome 点击 (824,516)</text>
  <text class="text small" x="96" y="523">随后输入“42,680”并继续点击</text>

  <rect x="379" y="346" width="294" height="198" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="text node-title" x="403" y="383">② 关键画面</text>
  <rect x="403" y="408" width="72" height="76" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
  <rect x="486" y="408" width="72" height="76" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
  <rect x="569" y="408" width="72" height="76" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
  <rect x="410" y="416" width="58" height="8" rx="4" fill="#ddd6fe"/>
  <rect x="410" y="432" width="35" height="42" rx="4" fill="#c4b5fd"/>
  <circle cx="458" cy="453" r="10" fill="#8b5cf6" opacity="0.75"/>
  <rect x="493" y="416" width="58" height="8" rx="4" fill="#ddd6fe"/>
  <rect x="493" y="432" width="58" height="42" rx="4" fill="#e9d5ff"/>
  <path d="M498 469l14-14 9 8 11-12 14 18z" fill="#a78bfa"/>
  <rect x="576" y="416" width="58" height="8" rx="4" fill="#ddd6fe"/>
  <rect x="576" y="432" width="25" height="42" rx="4" fill="#c4b5fd"/>
  <rect x="607" y="432" width="27" height="9" rx="4" fill="#ddd6fe"/>
  <rect x="607" y="447" width="21" height="8" rx="4" fill="#ddd6fe"/>

  <rect x="72" y="561" width="287" height="105" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="text node-title" x="96" y="597">③ 应用信息</text>
  <text class="text small" x="96" y="626">Numbers</text>
  <text class="text small" x="96" y="650">Chrome</text>

  <rect x="379" y="561" width="294" height="105" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="text node-title" x="403" y="597">④ 旁白文字</text>
  <rect x="590" y="576" width="59" height="27" rx="13.5" fill="#f3e8ff"/>
  <text class="text micro" x="619.5" y="595" text-anchor="middle">可选</text>
  <text class="text small" x="403" y="628">来自语音转写</text>
  <text class="text small" x="403" y="651">整段录音汇成一个文字块</text>

  <!-- Codex -->
  <rect x="735" y="254" width="665" height="446" rx="28" fill="#ecfdf5" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <rect x="735" y="254" width="665" height="68" rx="28" fill="#059669"/>
  <path d="M735 294 H1400 V322 H735 Z" fill="#059669"/>
  <text class="text panel-title" x="768" y="298" style="fill:#ffffff">Codex：JSON / JSONL 文字</text>
  <rect x="1211" y="273" width="156" height="32" rx="16" fill="#d1fae5"/>
  <text class="text badge" x="1289" y="295" text-anchor="middle" style="fill:#047857">结构化文本材料</text>

  <rect x="767" y="342" width="341" height="334" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text class="text node-title" x="791" y="378">① 操作写成一条条事件</text>
  <text class="text micro" x="1084" y="378" text-anchor="end">events.jsonl</text>

  <line x1="804" y1="405" x2="804" y2="597" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="804" cy="413" r="6" fill="#10b981"/>
  <text class="text micro" x="822" y="409">00:02 · selection.changed</text>
  <text class="text body" x="822" y="430">Numbers：本周金额 = 42,680</text>

  <circle cx="804" cy="459" r="6" fill="#10b981"/>
  <text class="text micro" x="822" y="455">00:06 · window.changed</text>
  <text class="text body" x="822" y="476">Chrome：数据后台</text>

  <circle cx="804" cy="505" r="6" fill="#10b981"/>
  <text class="text micro" x="822" y="501">00:09 · mouse.click</text>
  <text class="text body" x="822" y="522">点击文本框“本周金额”</text>

  <circle cx="804" cy="551" r="6" fill="#10b981"/>
  <text class="text micro" x="822" y="547">00:11 · keyboard.text_input</text>
  <text class="text body" x="822" y="568">输入 42,680</text>

  <circle cx="804" cy="597" r="6" fill="#10b981"/>
  <text class="text micro" x="822" y="593">00:14 · mouse.click</text>
  <text class="text body" x="822" y="614">点击按钮“提交”</text>

  <rect x="1126" y="342" width="242" height="334" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text class="text node-title" x="1150" y="378">② 事件还可附带 AX 文字</text>
  <rect x="1150" y="398" width="194" height="175" rx="12" fill="#f0fdf4"/>
  <rect x="1163" y="409" width="78" height="23" rx="11.5" fill="#d1fae5"/>
  <text class="text micro" x="1202" y="425" text-anchor="middle" style="fill:#047857">首次快照</text>
  <text class="text micro" x="1292" y="425" text-anchor="middle">fullTree</text>
  <text class="text mono" x="1163" y="458">role: Window</text>
  <text class="text mono" x="1163" y="481">title: 数据后台</text>
  <text class="text mono" x="1163" y="504">role: TextField</text>
  <text class="text mono" x="1163" y="527">title: 本周金额</text>
  <text class="text mono" x="1163" y="550">value: 42,680</text>

  <rect x="1150" y="580" width="194" height="73" rx="12" fill="#dcfce7"/>
  <rect x="1163" y="591" width="78" height="23" rx="11.5" fill="#bbf7d0"/>
  <text class="text micro" x="1202" y="607" text-anchor="middle" style="fill:#047857">后续变化</text>
  <text class="text micro" x="1247" y="628" text-anchor="middle">diffFromPrevious</text>
  <text class="text mono" x="1163" y="649">+ “提交成功”</text>

</svg>
