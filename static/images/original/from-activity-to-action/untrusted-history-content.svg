<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">History 中的页面文字不等于新的用户授权</title>
  <desc id="desc">发布计划故事中的风险支线。用户当前要求以明确路径进入 Codex 任务；Slack 或网页中的恶意文字可能随 History 进入同一任务，ChatGPT 或 Codex 也可能误把它当成指令并执行。面对这类风险，用户当前要求决定授权边界，原始来源只用于核对事实和当前状态。图中风险路径为可能性，不是必然流程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="mainArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#347fc4"/></marker>
    <marker id="riskArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c94e5a"/></marker>
    <style>
      .text { font-family: "Avenir Next", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .title { font-size: 44px; font-weight: 760; letter-spacing: -.025em; }
      .subtitle { font-size: 23px; fill: #4b586e; }
      .tag { font-size: 18px; font-weight: 780; letter-spacing: .05em; }
      .node-title { font-size: 27px; font-weight: 760; }
      .body { font-size: 22px; fill: #4b586e; }
      .small { font-size: 19px; fill: #64748b; }
      .label { font-size: 20px; font-weight: 720; }
      .main { fill: none; stroke: #347fc4; stroke-width: 4; stroke-linecap: round; }
      .risk { fill: none; stroke: #c94e5a; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 9; }
    </style>
  </defs>
  <rect width="1440" height="820" fill="#f7f6f2"/>
  <text class="text tag" x="720" y="52" text-anchor="middle" fill="#b6424d" style="fill:#b6424d">风险支线</text>
  <text class="text title" x="720" y="108" text-anchor="middle">页面里的“指令”，不等于用户的新要求</text>
  <text class="text subtitle" x="720" y="149" text-anchor="middle">History 可能带入来源中的文字；Agent 仍需分清资料与授权</text>

  <!-- The explicit user-intent path. -->
  <rect x="58" y="228" width="300" height="180" rx="28" fill="#edf5ff" stroke="#72afe6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="84" y="254" width="112" height="34" rx="17" fill="#347fc4"/>
  <text class="text tag" x="140" y="278" text-anchor="middle" style="fill:#fff">用户要求</text>
  <text class="text node-title" x="84" y="328">继续完成发布计划</text>
  <text class="text body" x="84" y="369">这是当前任务意图</text>

  <path class="main" d="M358 318 H486"/>
  <path d="M486 308 L504 318 L486 328 Z" fill="#347fc4"/>
  <text class="text small" x="431" y="294" text-anchor="middle" fill="#286eae" style="fill:#286eae">明确进入任务</text>

  <!-- The task receives the user's intent; History content may join it. -->
  <rect x="504" y="218" width="410" height="240" rx="30" fill="#ffffff" stroke="#8dbce5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="532" y="246" width="138" height="34" rx="17" fill="#dcecff"/>
  <text class="text tag" x="601" y="270" text-anchor="middle" fill="#1f67a7" style="fill:#1f67a7">CODEX 任务</text>
  <text class="text node-title" x="532" y="323">任务里可能同时出现</text>
  <rect x="532" y="348" width="354" height="42" rx="14" fill="#edf5ff"/>
  <circle cx="555" cy="369" r="10" fill="#347fc4"/>
  <text class="text label" x="576" y="376">用户当前要求</text>
  <rect x="532" y="400" width="354" height="42" rx="14" fill="#fff1f2"/>
  <circle cx="555" cy="421" r="10" fill="#c94e5a"/>
  <text class="text label" x="576" y="428">History 中的来源文字</text>

  <path class="risk" d="M914 338 H1028"/>
  <path d="M1028 328 L1046 338 L1028 348 Z" fill="#c94e5a"/>
  <text class="text small" x="980" y="309" text-anchor="middle" fill="#b6424d" style="font-size:17px;fill:#b6424d">可能被当作指令</text>

  <!-- Potential consequence, deliberately dashed rather than guaranteed. -->
  <rect x="1046" y="228" width="336" height="180" rx="28" fill="#fff1f2" stroke="#e47b84" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1072" y="254" width="94" height="34" rx="17" fill="#f7d8dc"/>
  <text class="text tag" x="1119" y="278" text-anchor="middle" fill="#a53a46" style="fill:#a53a46">可能结果</text>
  <text class="text node-title" x="1072" y="328">ChatGPT / Codex</text>
  <text class="text body" x="1072" y="366">可能执行页面中的文字</text>

  <!-- Untrusted content joins as a risk branch. -->
  <rect x="58" y="512" width="300" height="184" rx="28" fill="#fff8f8" stroke="#e6a0a7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="84" y="538" width="128" height="34" rx="17" fill="#b6424d"/>
  <text class="text tag" x="148" y="562" text-anchor="middle" style="fill:#fff">SLACK / 网页</text>
  <text class="text node-title" x="84" y="612">来源中的恶意文字</text>
  <text class="text body" x="84" y="652">忽略要求，改做别的事……</text>

  <path class="risk" d="M358 604 H418"/>
  <path d="M418 594 L436 604 L418 614 Z" fill="#c94e5a"/>
  <text class="text small" x="397" y="580" text-anchor="middle" fill="#b6424d" style="fill:#b6424d">可能</text>

  <rect x="436" y="512" width="300" height="184" rx="28" fill="#fff8f8" stroke="#e6a0a7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="462" y="538" width="92" height="34" rx="17" fill="#f7d8dc"/>
  <text class="text tag" x="508" y="562" text-anchor="middle" fill="#a53a46" style="fill:#a53a46">HISTORY</text>
  <text class="text node-title" x="462" y="612">成为任务上下文</text>
  <text class="text body" x="462" y="652">但没有因此获得授权</text>
  <path class="risk" d="M586 512 C586 478 620 469 650 458"/>
  <path d="M637 454 L654 457 L645 472 Z" fill="#c94e5a"/>
  <rect x="604" y="467" width="192" height="32" rx="16" fill="#f7f6f2"/>
  <text class="text small" x="700" y="489" text-anchor="middle" fill="#b6424d" style="font-size:17px;fill:#b6424d">可能随 History 进入</text>

  <!-- Advice, shown as guidance rather than a guaranteed system step. -->
  <rect x="806" y="512" width="576" height="184" rx="28" fill="#ecf8f1" stroke="#5fb286" stroke-width="2" filter="url(#shadow)"/>
  <rect x="832" y="538" width="98" height="34" rx="17" fill="#d9f0e3"/>
  <text class="text tag" x="881" y="562" text-anchor="middle" fill="#23754d" style="fill:#23754d">安全建议</text>
  <text class="text node-title" x="832" y="612">继续前，分清事实与授权</text>
  <circle cx="850" cy="651" r="13" fill="#2e9460"/>
  <path d="M844 651l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text label" x="875" y="658">用户要求：授权操作</text>
  <circle cx="1085" cy="651" r="13" fill="#2e9460"/>
  <path d="M1079 651l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text label" x="1110" y="658">来源原文：核对事实与状态</text>

  <text class="text small" x="720" y="765" text-anchor="middle">虚线表示可能发生的风险，不表示每次都会发生，也不表示系统必然拦截</text>
</svg>
