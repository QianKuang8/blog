<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">用户如何划定 Computer History 的观察边界</title>
  <desc id="desc">用户先用 Include only 或 Exclude 选择观察范围，范围内的应用和网站才可能贡献活动。活动可能包括点击、输入、快捷键、应用切换，以及 Accessibility 提供的文字和其他界面上下文。截图、麦克风和系统音频、私密浏览不进入 History。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/></marker>
    <style>
      .text { font-family: "Avenir Next", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 46px; font-weight: 750; letter-spacing: -.025em; }
      .subtitle { font-size: 23px; fill: #475569; }
      .stage { font-size: 18px; font-weight: 750; letter-spacing: .05em; }
      .node-title { font-size: 27px; font-weight: 750; }
      .body { font-size: 22px; fill: #334155; }
      .small { font-size: 19px; fill: #64748b; }
      .label { font-size: 19px; font-weight: 700; }
      .flow { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1440" height="820" fill="#f8fafc"/>
  <text class="text stage" x="720" y="52" text-anchor="middle" fill="#c2410c" style="fill:#c2410c">观察边界</text>
  <text class="text title" x="720" y="111" text-anchor="middle">先选范围，再观察范围内的活动</text>
  <text class="text subtitle" x="720" y="151" text-anchor="middle">来源由用户决定；History 得到的是活动线索和界面上下文</text>

  <!-- 1. Settings choice. -->
  <text class="text stage" x="70" y="220" fill="#c2410c" style="fill:#c2410c">1 · 选择方式</text>
  <rect x="54" y="242" width="374" height="354" rx="30" fill="#fff7ed" stroke="#fb923c" stroke-width="2" filter="url(#shadow)"/>
  <text class="text node-title" x="86" y="300">用户划定观察范围</text>
  <rect x="86" y="335" width="310" height="78" rx="20" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <circle cx="123" cy="374" r="17" fill="#f97316"/>
  <path d="M116 374h14M123 367v14" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
  <text class="text label" x="154" y="368">Include only</text>
  <text class="text small" x="154" y="396">只包括选中的来源</text>
  <rect x="86" y="439" width="310" height="78" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="123" cy="478" r="17" fill="#64748b"/>
  <path d="M116 478h14" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
  <text class="text label" x="154" y="472">Exclude</text>
  <text class="text small" x="154" y="500">排除不想观察的来源</text>
  <text class="text small" x="86" y="560">两种方式都在定义同一条边界</text>

  <path class="flow" d="M428 419 H498"/>
  <path d="M488 409 L502 419 L488 429 Z" fill="#64748b"/>

  <!-- 2. Sources inside the boundary. -->
  <text class="text stage" x="530" y="220" fill="#b45309" style="fill:#b45309">2 · 范围内的来源</text>
  <rect x="514" y="242" width="308" height="354" rx="30" fill="#fffaf0" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text class="text node-title" x="546" y="300">可以贡献活动</text>
  <rect x="546" y="337" width="244" height="62" rx="20" fill="#ffffff" stroke="#fde68a"/>
  <circle cx="577" cy="368" r="15" fill="#f59e0b"/>
  <path d="M571 359h8l5 5v13h-13zM579 359v5h5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <text class="text label" x="606" y="375">文档 app</text>
  <rect x="546" y="415" width="244" height="62" rx="20" fill="#ffffff" stroke="#fde68a"/>
  <circle cx="577" cy="446" r="15" fill="#f59e0b"/>
  <circle cx="577" cy="446" r="7" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M570 446h14M577 439c-3 4-3 10 0 14M577 439c3 4 3 10 0 14" fill="none" stroke="#fff" stroke-width="1.5"/>
  <text class="text label" x="606" y="453">网站</text>
  <rect x="546" y="493" width="244" height="62" rx="20" fill="#ffffff" stroke="#fde68a"/>
  <circle cx="577" cy="524" r="15" fill="#f59e0b"/>
  <path d="M569 518h16v10h-7l-5 4v-4h-4z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <text class="text label" x="606" y="531">消息 app</text>

  <path class="flow" d="M822 419 H892"/>
  <path d="M882 409 L896 419 L882 429 Z" fill="#64748b"/>

  <!-- 3. Possible signals from those sources. -->
  <text class="text stage" x="924" y="220" fill="#1d4ed8" style="fill:#1d4ed8">3 · 可能包含的活动线索</text>
  <rect x="908" y="242" width="478" height="354" rx="30" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="291" width="414" height="112" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="981" cy="347" r="24" fill="#3b82f6"/>
  <path d="M970 347h22M981 336v22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text class="text node-title" x="1022" y="337">交互事件</text>
  <text class="text body" x="1022" y="373">点击、输入、快捷键、app 切换</text>
  <rect x="940" y="431" width="414" height="112" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="981" cy="487" r="24" fill="#2563eb"/>
  <rect x="970" y="476" width="22" height="22" rx="4" fill="none" stroke="#fff" stroke-width="2.5"/>
  <path d="M975 482h12M975 488h10M975 494h8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <text class="text node-title" x="1022" y="477">Accessibility 上下文</text>
  <text class="text body" x="1022" y="513">文字和其他界面上下文</text>

  <text class="text stage" x="84" y="669" fill="#64748b" style="fill:#64748b">不进入 History</text>
  <line x1="250" y1="662" x2="1360" y2="662" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
  <g transform="translate(190 724)">
    <circle cx="0" cy="0" r="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><rect x="-13" y="-9" width="26" height="18" rx="3" fill="none" stroke="#64748b" stroke-width="2.5"/><path d="M-18 -18L18 18" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/><text class="text body" x="44" y="8">截图</text>
  </g>
  <g transform="translate(515 724)">
    <circle cx="0" cy="0" r="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><path d="M0 -13V4M-8 2A8 8 0 0 0 8 2M0 10V16" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><path d="M-18 -18L18 18" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/><text class="text body" x="44" y="-3">麦克风或</text><text class="text body" x="44" y="25">系统音频</text>
  </g>
  <g transform="translate(920 724)">
    <circle cx="0" cy="0" r="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><path d="M-13 -7H13V9H-13ZM-7 -12V-4M7 -12V-4" fill="none" stroke="#64748b" stroke-width="2.5"/><path d="M-18 -18L18 18" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/><text class="text body" x="44" y="8">私密浏览</text>
  </g>
</svg>
