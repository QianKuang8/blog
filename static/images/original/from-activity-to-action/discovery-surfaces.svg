<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">用户在 Settings 里了解并开启 Computer History</title>
  <desc id="desc">Settings 先用四类具体例子说明 Computer History 能做什么，再让用户确认 Memories、明确同意持续观察，并选择应用和网站范围。页面上的例子是功能说明，不是用户已有的 History。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/></marker>
    <style>
      .text { font-family: "Avenir Next", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 46px; font-weight: 750; letter-spacing: -.025em; }
      .subtitle { font-size: 23px; fill: #475569; }
      .stage { font-size: 19px; font-weight: 750; letter-spacing: .06em; }
      .surface { font-size: 31px; font-weight: 750; }
      .body { font-size: 22px; fill: #334155; }
      .small { font-size: 19px; fill: #64748b; }
      .label { font-size: 19px; font-weight: 700; }
      .flow { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="780" fill="#f8fafc"/>
  <text class="text stage" x="720" y="52" text-anchor="middle" fill="#0369a1" style="fill:#0369a1">第一次了解</text>
  <text class="text title" x="720" y="111" text-anchor="middle">用户为什么愿意开启 Computer History？</text>
  <text class="text subtitle" x="720" y="151" text-anchor="middle">Settings 先解释能做什么，再把选择交给用户</text>

  <!-- Settings surface -->
  <g transform="translate(380 -20) scale(1.1)">
  <rect x="64" y="238" width="490" height="472" rx="30" fill="#fff7ed" stroke="#fb923c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="64" y="238" width="490" height="62" rx="30" fill="#ffedd5"/>
  <path d="M64 270 H554 V300 H64 Z" fill="#ffedd5"/>
  <circle cx="96" cy="269" r="7" fill="#fb7185"/><circle cx="120" cy="269" r="7" fill="#fbbf24"/><circle cx="144" cy="269" r="7" fill="#34d399"/>
  <text class="text surface" x="180" y="280">Settings</text>
  <text class="text body" x="92" y="340">“它能帮我做什么？”</text>

  <rect x="92" y="370" width="204" height="66" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  <circle cx="120" cy="403" r="16" fill="#fb923c"/>
  <path d="M114 403 L119 408 L127 397" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text label" x="148" y="411">记住会后承诺</text>
  <rect x="316" y="370" width="210" height="66" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  <circle cx="344" cy="403" r="16" fill="#f59e0b"/>
  <path d="M338 397 H350 V409 H338 Z M341 394 V400 M347 394 V400" fill="none" stroke="#fff" stroke-width="2"/>
  <text class="text label" x="372" y="411">接着刚才工作</text>
  <rect x="92" y="452" width="204" height="66" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  <circle cx="120" cy="485" r="16" fill="#ea580c"/>
  <circle cx="117" cy="482" r="6" fill="none" stroke="#fff" stroke-width="2"/><path d="M122 487 L128 493" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text class="text label" x="148" y="493">按线索找文档</text>
  <rect x="316" y="452" width="210" height="66" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  <circle cx="344" cy="485" r="16" fill="#c2410c"/>
  <path d="M336 490 L342 482 L347 486 L353 477" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text label" x="372" y="493">看跨应用进度</text>

  <line x1="92" y1="550" x2="526" y2="550" stroke="#fed7aa" stroke-width="2"/>
  <circle cx="108" cy="586" r="10" fill="#10b981"/><path d="M103 586 L107 590 L114 581" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text small" x="132" y="593">开启 Memories，并明确同意</text>
  <circle cx="108" cy="630" r="10" fill="#10b981"/><path d="M103 630 L107 634 L114 625" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text small" x="132" y="637">设置 app 与网站范围</text>
  <rect x="336" y="666" width="190" height="36" rx="18" fill="#f97316"/>
  <text class="text label" x="431" y="690" text-anchor="middle" fill="#ffffff" style="fill:#fff">由用户决定开启</text>
  </g>
</svg>
