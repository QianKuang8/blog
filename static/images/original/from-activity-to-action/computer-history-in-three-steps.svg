<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Computer History 的三步用户主线</title>
  <desc id="desc">用户先为应用和网站划定观察范围，系统把获准范围中的零散活动整理成可阅读的 History，用户再借助 History 找回工作、回顾一周或复用重复流程。</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/></marker>
    <style>
      .text { font-family: "Avenir Next", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 46px; font-weight: 750; letter-spacing: -.025em; }
      .subtitle { font-size: 23px; fill: #475569; }
      .step { font-size: 19px; font-weight: 750; letter-spacing: .08em; }
      .node-title { font-size: 31px; font-weight: 750; }
      .body { font-size: 22px; fill: #334155; }
      .label { font-size: 19px; font-weight: 700; }
      .flow { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="720" fill="#f8fafc"/>
  <text class="text step" x="720" y="54" text-anchor="middle" fill="#0369a1" style="fill:#0369a1">一眼看懂</text>
  <text class="text title" x="720" y="113" text-anchor="middle">Computer History 怎样把过去接到下一步？</text>
  <text class="text subtitle" x="720" y="154" text-anchor="middle">先划定范围，再得到可读线索，最后选择怎么使用</text>

  <!-- Step 1: open permission gate -->
  <text class="text step" x="238" y="227" text-anchor="middle" fill="#c2410c" style="fill:#c2410c">01</text>
  <circle cx="238" cy="354" r="118" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <path d="M214 304 H262 V390 H214 Z M238 304 V390" fill="none" stroke="#f97316" stroke-width="5" stroke-linejoin="round"/>
  <path d="M190 347 H224 M252 347 H286" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <circle cx="238" cy="347" r="7" fill="#f97316"/>
  <rect x="131" y="480" width="88" height="36" rx="18" fill="#ffedd5"/>
  <text class="text label" x="175" y="504" text-anchor="middle" fill="#c2410c" style="fill:#c2410c">app</text>
  <rect x="231" y="480" width="114" height="36" rx="18" fill="#ffedd5"/>
  <text class="text label" x="288" y="504" text-anchor="middle" fill="#c2410c" style="fill:#c2410c">网站</text>
  <text class="text node-title" x="238" y="568" text-anchor="middle">划定范围</text>
  <text class="text body" x="238" y="607" text-anchor="middle">设置 app 与网站范围</text>

  <path class="flow" d="M372 354 H538"/>

  <!-- Step 2: a readable history note -->
  <text class="text step" x="720" y="227" text-anchor="middle" fill="#1d4ed8" style="fill:#1d4ed8">02</text>
  <path d="M634 248 H770 L806 284 V455 Q806 475 786 475 H634 Q614 475 614 455 V268 Q614 248 634 248 Z" fill="#eff6ff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <path d="M770 248 V284 H806" fill="#dbeafe" stroke="#60a5fa" stroke-width="3" stroke-linejoin="round"/>
  <rect x="646" y="305" width="128" height="17" rx="8.5" fill="#2563eb"/>
  <rect x="646" y="345" width="106" height="12" rx="6" fill="#93c5fd"/>
  <rect x="646" y="375" width="128" height="12" rx="6" fill="#93c5fd"/>
  <rect x="646" y="405" width="92" height="12" rx="6" fill="#93c5fd"/>
  <text class="text node-title" x="720" y="568" text-anchor="middle">整理成 History</text>
  <text class="text body" x="720" y="607" text-anchor="middle">把零散活动变成可读线索</text>

  <path class="flow" d="M902 354 H1068"/>

  <!-- Step 3: three actions fan from one choice point -->
  <text class="text step" x="1202" y="227" text-anchor="middle" fill="#047857" style="fill:#047857">03</text>
  <circle cx="1202" cy="354" r="76" fill="#10b981" filter="url(#shadow)"/>
  <path d="M1172 348 H1216 V374 H1198 L1187 384 V374 H1172 Z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1228 318 L1240 330 L1262 305" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1202 430 V462 M1202 462 H1094 M1202 462 H1310" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1094" cy="462" r="5" fill="#10b981"/>
  <circle cx="1202" cy="462" r="5" fill="#10b981"/>
  <circle cx="1310" cy="462" r="5" fill="#10b981"/>
  <text class="text label" x="1094" y="500" text-anchor="middle" fill="#047857" style="fill:#047857">找回工作</text>
  <text class="text label" x="1202" y="500" text-anchor="middle" fill="#047857" style="fill:#047857">回顾一周</text>
  <text class="text label" x="1310" y="500" text-anchor="middle" fill="#047857" style="fill:#047857">复用流程</text>
  <text class="text node-title" x="1202" y="568" text-anchor="middle">选择下一步</text>
  <text class="text body" x="1202" y="607" text-anchor="middle">下一步仍由用户决定</text>
</svg>
