<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">午休回来，Computer History 如何帮助用户继续发布计划</title>
  <desc id="desc">上午的文档、浏览器和沟通活动被整理成一条具体 History 摘要。用户午休后用这条线索打开原始发布文档与沟通记录，核实后继续工作。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/></marker>
    <style>
      .text { font-family: "Avenir Next", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 46px; font-weight: 750; letter-spacing: -.025em; }
      .subtitle { font-size: 23px; fill: #475569; }
      .kicker { font-size: 18px; font-weight: 750; letter-spacing: .08em; }
      .time { font-size: 20px; font-weight: 750; }
      .card-title { font-size: 28px; font-weight: 750; }
      .body { font-size: 23px; fill: #334155; }
      .small { font-size: 19px; fill: #64748b; }
      .label { font-size: 19px; font-weight: 700; }
      .flow { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="760" fill="#f8fafc"/>
  <text class="text kicker" x="720" y="52" text-anchor="middle" fill="#b45309" style="fill:#b45309">一个恢复工作的下午</text>
  <text class="text title" x="720" y="111" text-anchor="middle">午休回来，我刚才做到哪了？</text>
  <text class="text subtitle" x="720" y="151" text-anchor="middle">一条活动摘要，带我回到发布计划的最新现场</text>

  <text class="text time" x="88" y="214" fill="#b45309" style="fill:#b45309">09:30–11:50</text>
  <rect x="64" y="238" width="388" height="338" rx="30" fill="#fff7ed" stroke="#fb923c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="90" y="264" width="112" height="34" rx="17" fill="#ffedd5"/>
  <text class="text label" x="146" y="287" text-anchor="middle" fill="#c2410c" style="fill:#c2410c">上午工作</text>
  <text class="text card-title" x="90" y="344">推进“发布计划”</text>
  <circle cx="112" cy="405" r="23" fill="#fb923c"/>
  <path d="M104 393 H115 L122 400 V416 H104 Z M115 393 V400 H122 M108 406 H118" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="text body" x="150" y="413">补齐发布清单</text>
  <circle cx="112" cy="468" r="23" fill="#f59e0b"/>
  <circle cx="112" cy="468" r="10" fill="none" stroke="#fff" stroke-width="2.3"/>
  <path d="M102 468 H122 M112 458 C107 463 107 473 112 478 M112 458 C117 463 117 473 112 478" fill="none" stroke="#fff" stroke-width="1.8"/>
  <text class="text body" x="150" y="476">核对上线说明</text>
  <circle cx="112" cy="531" r="23" fill="#ea580c"/>
  <path d="M102 521 H123 V534 H114 L108 539 V534 H102 Z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
  <text class="text body" x="150" y="539">确认剩余阻塞项</text>

  <path class="flow" d="M452 407 H512"/>
  <text class="text time" x="564" y="214" text-anchor="middle" fill="#64748b" style="fill:#64748b">12:00</text>
  <circle cx="564" cy="407" r="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="549" y="386" width="9" height="42" rx="4.5" fill="#64748b"/>
  <rect x="570" y="386" width="9" height="42" rx="4.5" fill="#64748b"/>
  <text class="text label" x="564" y="482" text-anchor="middle">午休中断</text>
  <text class="text small" x="564" y="513" text-anchor="middle">工作暂时停下</text>
  <path class="flow" d="M612 407 H672"/>

  <text class="text time" x="704" y="214" fill="#1d4ed8" style="fill:#1d4ed8">13:10</text>
  <rect x="676" y="238" width="376" height="338" rx="30" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="702" y="264" width="90" height="34" rx="17" fill="#dbeafe"/>
  <text class="text label" x="747" y="287" text-anchor="middle" fill="#1d4ed8" style="fill:#1d4ed8">History</text>
  <text class="text card-title" x="702" y="340">发布计划 · 上午</text>
  <text class="text small" x="1026" y="339" text-anchor="end">11:28–11:50</text>
  <line x1="702" y1="365" x2="1026" y2="365" stroke="#bfdbfe" stroke-width="2"/>
  <text class="text body" x="702" y="407">补齐发布清单，核对上线说明</text>
  <text class="text body" x="702" y="445">并确认剩余阻塞项</text>
  <rect x="702" y="478" width="94" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="text small" x="749" y="501" text-anchor="middle">文档</text>
  <rect x="808" y="478" width="104" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="text small" x="860" y="501" text-anchor="middle">浏览器</text>
  <rect x="924" y="478" width="102" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="text small" x="975" y="501" text-anchor="middle">沟通</text>
  <text class="text small" x="702" y="548">Ask：我应该从哪里继续？</text>

  <path class="flow" d="M1052 407 H1112"/>
  <text class="text time" x="1140" y="214" fill="#047857" style="fill:#047857">接着做</text>
  <rect x="1116" y="238" width="260" height="338" rx="30" fill="#ecfdf5" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1142" y="264" width="118" height="34" rx="17" fill="#d1fae5"/>
  <text class="text label" x="1201" y="287" text-anchor="middle" fill="#047857" style="fill:#047857">原始来源</text>
  <rect x="1142" y="326" width="208" height="74" rx="18" fill="#ffffff" stroke="#a7f3d0"/>
  <circle cx="1171" cy="363" r="18" fill="#10b981"/>
  <path d="M1165 352 H1173 L1178 357 V373 H1165 Z M1173 352 V357 H1178" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <text class="text label" x="1200" y="371">发布文档</text>
  <rect x="1142" y="414" width="208" height="74" rx="18" fill="#ffffff" stroke="#a7f3d0"/>
  <circle cx="1171" cy="451" r="18" fill="#059669"/>
  <path d="M1162 443 H1180 V454 H1172 L1167 458 V454 H1162 Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <text class="text label" x="1200" y="459">阻塞项对话</text>
  <path d="M1165 526 L1174 535 L1192 514" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text label" x="1210" y="534" fill="#047857" style="fill:#047857">核实后继续</text>

  <text class="text label" x="720" y="656" text-anchor="middle" fill="#334155" style="fill:#334155">History 给出线索 → 打开原始来源 → 继续工作</text>
</svg>
