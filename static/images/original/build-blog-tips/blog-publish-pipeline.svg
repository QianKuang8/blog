<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
  <title id="title">从写完文章到读者能看到</title>
  <desc id="desc">写文章：hugo new content 生成草稿，写正文与 frontmatter，写完删掉 draft: true。本地预览：hugo server -D 显示草稿，检查标题、目录、代码块、表格和图片，再点击相关链接。正式构建：build_site.py 先检查文章和来源记录，再在临时目录干净构建，然后检查产物，全部通过才替换 public/，任何一步失败都保留上一次通过检查的产物。推送到 main 后，GitHub Actions 校验 Hugo 安装包 checksum、运行测试、用同一个 build_site.py 构建并部署。最后验收 workflow 部署成功和线上页面显示本次修改。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50647a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="690" rx="20" fill="#f5f7fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="50" font-size="27" font-weight="700" fill="#182b40">从写完文章到读者能看到</text>
    <text x="40" y="86" font-size="19" fill="#526478">本地预览与正式构建各检查一次；推送后 GitHub Actions 用同一个 build_site.py 构建并部署</text>
    <g font-size="16" fill="#526478">
      <rect x="40" y="107" width="16" height="16" rx="3" fill="#fff" stroke="#c8d2de"/>
      <text x="64" y="121">写作操作</text>
      <rect x="164" y="107" width="16" height="16" rx="3" fill="#e7f4ee" stroke="#a3cdbb"/>
      <text x="188" y="121">检查</text>
      <rect x="256" y="107" width="16" height="16" rx="3" fill="#e9f0fb" stroke="#a9bfdc"/>
      <text x="280" y="121">构建与部署</text>
      <rect x="396" y="107" width="16" height="16" rx="3" fill="#fff4df" stroke="#d9c397"/>
      <text x="420" y="121">失败时的处理</text>
    </g>

    <!-- stage labels -->
    <g fill="#fff" stroke="#c8d2de">
      <rect x="40" y="146" width="156" height="56" rx="10"/>
      <rect x="40" y="232" width="156" height="56" rx="10"/>
      <rect x="40" y="318" width="156" height="56" rx="10"/>
      <rect x="40" y="474" width="156" height="56" rx="10"/>
      <rect x="40" y="568" width="156" height="56" rx="10"/>
    </g>
    <g text-anchor="middle">
      <g font-size="19" font-weight="700" fill="#182b40">
        <text x="118" y="171">写文章</text>
        <text x="118" y="257">本地预览</text>
        <text x="118" y="343">正式构建</text>
        <text x="118" y="499">推送到 main</text>
        <text x="118" y="603">验收</text>
      </g>
      <g font-size="16" fill="#526478">
        <text x="118" y="193">hugo new content</text>
        <text x="118" y="279">hugo server -D</text>
        <text x="118" y="365">build_site.py</text>
        <text x="118" y="521">GitHub Actions</text>
      </g>
    </g>
    <g fill="none" stroke="#50647a" stroke-width="1.7">
      <path d="M118 204 V224" marker-end="url(#arrow)"/>
      <path d="M118 290 V310" marker-end="url(#arrow)"/>
      <path d="M118 376 V466" marker-end="url(#arrow)"/>
      <path d="M118 532 V560" marker-end="url(#arrow)"/>
    </g>

    <!-- row 1: write -->
    <g fill="#fff" stroke="#c8d2de">
      <rect x="228" y="153" width="186" height="42" rx="8"/>
      <rect x="442" y="153" width="196" height="42" rx="8"/>
      <rect x="666" y="153" width="186" height="42" rx="8"/>
    </g>
    <g font-size="17" fill="#344d68" text-anchor="middle">
      <text x="321" y="180">生成草稿 draft: true</text>
      <text x="540" y="180">写正文与 frontmatter</text>
      <text x="759" y="180">写完删掉 draft: true</text>
    </g>

    <!-- row 2: preview -->
    <g fill="#e7f4ee" stroke="#a3cdbb">
      <rect x="228" y="239" width="300" height="42" rx="8"/>
      <rect x="556" y="239" width="196" height="42" rx="8"/>
    </g>
    <g font-size="17" fill="#21624a" text-anchor="middle">
      <text x="378" y="266">看标题、目录、代码块、表格和图片</text>
      <text x="654" y="266">顺着文章点击相关链接</text>
    </g>
    <g font-size="16" fill="#526478">
      <text x="780" y="254">-D 会显示草稿；</text>
      <text x="780" y="277">正式构建排除草稿</text>
    </g>

    <!-- row 3: build_site.py -->
    <rect x="228" y="325" width="174" height="42" rx="8" fill="#e7f4ee" stroke="#a3cdbb"/>
    <rect x="430" y="325" width="156" height="42" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
    <rect x="614" y="325" width="96" height="42" rx="8" fill="#e7f4ee" stroke="#a3cdbb"/>
    <rect x="738" y="325" width="222" height="42" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
    <g font-size="17" text-anchor="middle">
      <text x="315" y="352" fill="#21624a">检查文章和来源记录</text>
      <text x="508" y="352" fill="#254d7a">临时目录干净构建</text>
      <text x="662" y="352" fill="#21624a">检查产物</text>
      <text x="849" y="352" fill="#254d7a">全部通过才替换 public/</text>
    </g>
    <rect x="228" y="404" width="482" height="38" rx="8" fill="#fff4df" stroke="#d9c397"/>
    <text x="469" y="429" text-anchor="middle" font-size="17" fill="#725025">任何一步失败：保留上一次通过检查的产物</text>

    <!-- row 4: GitHub Actions -->
    <rect x="228" y="481" width="250" height="42" rx="8" fill="#e7f4ee" stroke="#a3cdbb"/>
    <rect x="506" y="481" width="100" height="42" rx="8" fill="#e7f4ee" stroke="#a3cdbb"/>
    <rect x="634" y="481" width="160" height="42" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
    <rect x="822" y="481" width="80" height="42" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
    <g font-size="17" text-anchor="middle">
      <text x="353" y="508" fill="#21624a">校验 Hugo 安装包 checksum</text>
      <text x="556" y="508" fill="#21624a">运行测试</text>
      <text x="714" y="508" fill="#254d7a">build_site.py</text>
      <text x="862" y="508" fill="#254d7a">部署</text>
    </g>
    <text x="714" y="547" text-anchor="middle" font-size="16" fill="#526478">与本地正式构建同一入口</text>

    <!-- row 5: acceptance -->
    <rect x="228" y="575" width="184" height="42" rx="8" fill="#e7f4ee" stroke="#a3cdbb"/>
    <rect x="432" y="575" width="208" height="42" rx="8" fill="#e7f4ee" stroke="#a3cdbb"/>
    <g font-size="17" fill="#21624a" text-anchor="middle">
      <text x="320" y="602">workflow 部署成功</text>
      <text x="536" y="602">线上页面显示本次修改</text>
    </g>
    <g font-size="16" fill="#526478">
      <text x="668" y="590">带 PDF 时，再打开站点 PDF</text>
      <text x="668" y="613">和固定版本的 GitHub 文件链接</text>
    </g>

    <g fill="none" stroke="#50647a" stroke-width="1.7">
      <path d="M414 174 H436" marker-end="url(#arrow)"/>
      <path d="M638 174 H660" marker-end="url(#arrow)"/>
      <path d="M528 260 H550" marker-end="url(#arrow)"/>
      <path d="M402 346 H424" marker-end="url(#arrow)"/>
      <path d="M586 346 H608" marker-end="url(#arrow)"/>
      <path d="M710 346 H732" marker-end="url(#arrow)"/>
      <path d="M478 502 H500" marker-end="url(#arrow)"/>
      <path d="M606 502 H628" marker-end="url(#arrow)"/>
      <path d="M794 502 H816" marker-end="url(#arrow)"/>
      <g stroke-dasharray="4 3">
        <path d="M315 369 V396" marker-end="url(#arrow)"/>
        <path d="M508 369 V396" marker-end="url(#arrow)"/>
        <path d="M662 369 V396" marker-end="url(#arrow)"/>
      </g>
    </g>

    <text x="500" y="668" text-anchor="middle" font-size="16" fill="#64758a">按 2026 年 10 月 10 日的仓库配置整理；推送后的部署部分依据 workflow，未在当天单独复跑</text>
  </g>
</svg>
