<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-labelledby="title desc">
  <title id="title">响应到达之后，请求还可能在本地等待</title>
  <desc id="desc">假设示例：请求在零毫秒发出，二十毫秒时响应到达 socket，八十毫秒时事件循环继续处理，九十毫秒完成。六十毫秒本地等待与二十毫秒下游等待属于不同阶段。数字不是生产测量。</desc>
  <rect width="960" height="436" rx="18" fill="#f5f7fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="49" font-size="27" font-weight="700" fill="#182b40">响应到了，处理仍可能排队</text>
    <text x="40" y="84" font-size="20" fill="#526478">假设示例 · 只说明时间归属，不表示生产测量</text>
    <g stroke="#c4ceda" stroke-width="1" stroke-dasharray="4 5">
      <path d="M72 126 V302"/><path d="M252 126 V302"/>
      <path d="M792 126 V302"/><path d="M882 126 V302"/>
    </g>
    <rect x="72" y="166" width="180" height="70" rx="7" fill="#c9e8dc"/>
    <rect x="252" y="166" width="540" height="70" rx="7" fill="#f6dfb0"/>
    <rect x="792" y="166" width="90" height="70" rx="7" fill="#c8d9f0"/>
    <g fill="#182b40" font-size="20" text-anchor="middle">
      <text x="162" y="195">等待下游</text><text x="162" y="221">20 ms</text>
      <text x="522" y="195">响应已到达，等待事件循环处理</text><text x="522" y="221">60 ms</text>
      <text x="837" y="195">处理</text><text x="837" y="221">10 ms</text>
    </g>
    <g fill="#344d68" font-size="19">
      <text x="72" y="145" text-anchor="middle">0</text>
      <text x="252" y="145" text-anchor="middle">20</text>
      <text x="792" y="145" text-anchor="middle">80</text>
      <text x="882" y="145" text-anchor="middle">90 ms</text>
      <text x="72" y="278" text-anchor="middle">发出</text>
      <text x="252" y="278" text-anchor="middle">到达 socket</text>
      <text x="772" y="278" text-anchor="end">继续处理</text>
      <text x="882" y="278" text-anchor="middle">完成</text>
    </g>
    <rect x="40" y="327" width="880" height="73" rx="10" fill="#fff" stroke="#d4dce5"/>
    <text x="62" y="356" font-size="20" fill="#182b40">端到端：90 ms　　下游等待：20 ms　　本地等待：60 ms</text>
    <text x="62" y="384" font-size="18" fill="#526478">每个时间点都需要对应观测；应用日志不一定能直接测到 socket 到达时刻。</text>
  </g>
</svg>
