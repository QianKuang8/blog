<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">新闻检索 Agent 的流程：supervisor 调度 search、answer 与 judge</title>
  <desc id="desc">流程从 start 进入 supervisor。supervisor 通过条件边（虚线）把任务交给 search 或 answer；search 完成后回到 supervisor；answer 之后进入 judge；judge 按评估结果分流：不通过回到 supervisor，通过则结束。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50647a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="620" rx="20" fill="#f5f7fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="50" font-size="27" font-weight="700" fill="#182b40">新闻检索 Agent 的流程</text>
    <text x="40" y="86" font-size="19" fill="#526478">supervisor 决定下一步交给谁；search、answer、judge 各由一个 Agent 负责</text>

    <!-- edges -->
    <g fill="none" stroke="#50647a" stroke-width="1.8">
      <path d="M300 176 V202" marker-end="url(#arrow)"/>
      <path d="M248 266 L184 324" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
      <path d="M208 328 L270 272" marker-end="url(#arrow)"/>
      <path d="M352 266 L416 324" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
      <path d="M430 384 V432" marker-end="url(#arrow)"/>
      <path d="M512 466 C 600 466, 600 236, 398 236" marker-end="url(#arrow)"/>
      <path d="M430 494 V530" marker-end="url(#arrow)"/>
    </g>

    <!-- nodes -->
    <ellipse cx="300" cy="152" rx="70" ry="24" fill="#fff" stroke="#c8d2de"/>
    <rect x="210" y="208" width="180" height="54" rx="12" fill="#e9f0fb" stroke="#a9bfdc"/>
    <rect x="90" y="330" width="160" height="52" rx="12" fill="#fff" stroke="#c8d2de"/>
    <rect x="350" y="330" width="160" height="52" rx="12" fill="#fff" stroke="#c8d2de"/>
    <rect x="350" y="440" width="160" height="52" rx="12" fill="#fff4df" stroke="#d9c397"/>
    <ellipse cx="430" cy="560" rx="70" ry="24" fill="#e7f4ee" stroke="#a3cdbb"/>
    <g font-size="19" text-anchor="middle">
      <text x="300" y="158" fill="#526478">start</text>
      <text x="300" y="242" font-weight="700" fill="#24486f">supervisor</text>
      <text x="170" y="362" fill="#344d68">search</text>
      <text x="430" y="362" fill="#344d68">answer</text>
      <text x="430" y="472" font-weight="700" fill="#725025">judge</text>
      <text x="430" y="566" fill="#21624a">end</text>
    </g>

    <!-- legend -->
    <rect x="640" y="134" width="320" height="126" rx="10" fill="#fff" stroke="#c8d2de"/>
    <g fill="none" stroke="#50647a" stroke-width="1.8">
      <path d="M660 176 H712" marker-end="url(#arrow)"/>
      <path d="M660 220 H712" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
    </g>
    <g font-size="17" fill="#344d68">
      <text x="728" y="182">实线：其余连线</text>
      <text x="728" y="226">虚线：条件边</text>
    </g>
    <text x="728" y="248" font-size="16" fill="#526478">由 supervisor 决定走向</text>

    <!-- callout for the discussed edge -->
    <rect x="640" y="300" width="320" height="130" rx="10" fill="#fff4df" stroke="#d9c397"/>
    <text x="658" y="334" font-size="18" font-weight="700" fill="#725025">judge 按评估结果分流</text>
    <text x="658" y="364" font-size="16" fill="#725025">不通过回到 supervisor，通过则结束</text>
    <text x="658" y="390" font-size="16" fill="#725025">正文讨论：评估结论中哪些内容</text>
    <text x="658" y="414" font-size="16" fill="#725025">要写回 supervisor 的上下文</text>
  </g>
</svg>
