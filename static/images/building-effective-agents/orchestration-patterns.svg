<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="842" viewBox="0 0 1000 842" role="img" aria-labelledby="title desc">
  <title id="title">六种编排模式：下一步由谁决定</title>
  <desc id="desc">链式调用、路由、并行、协调者-执行者和评价-优化由代码预先定义路径，自主 Agent 由模型根据环境反馈决定下一步。每张卡片给出数据流与适用条件。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#50647a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="842" rx="20" fill="#f5f7fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="42" y="50" font-size="27" font-weight="700" fill="#182b40">六种编排模式：下一步由谁决定</text>
    <text x="42" y="86" font-size="19" fill="#526478">前五种由代码预先定义路径（Workflow），最后一种由模型动态决定（Agent）</text>

    <!-- 1. Prompt chaining -->
    <g transform="translate(42 112)">
      <rect width="450" height="216" rx="14" fill="#fff" stroke="#c8d2de"/>
      <text x="20" y="38" font-size="21" font-weight="700" fill="#182b40">链式调用</text>
      <text x="112" y="38" font-size="16" fill="#526478">Prompt Chaining</text>
      <g fill="none" stroke="#50647a" stroke-width="1.7">
        <path d="M60 92 H78" marker-end="url(#arrow)"/>
        <path d="M162 92 H180" marker-end="url(#arrow)"/>
        <path d="M252 92 H270" marker-end="url(#arrow)"/>
        <path d="M354 92 H372" marker-end="url(#arrow)"/>
        <path d="M217 112 V136" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
      </g>
      <rect x="84" y="74" width="74" height="36" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
      <rect x="186" y="74" width="62" height="36" rx="8" fill="#fff4df" stroke="#d9c397"/>
      <rect x="276" y="74" width="74" height="36" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
      <g font-size="17" text-anchor="middle">
        <text x="121" y="98" fill="#254d7a">LLM 1</text>
        <text x="217" y="98" fill="#725025">检查</text>
        <text x="313" y="98" fill="#254d7a">LLM 2</text>
      </g>
      <g font-size="17" fill="#526478">
        <text x="20" y="98">输入</text>
        <text x="378" y="98">输出</text>
      </g>
      <text x="230" y="152" font-size="15" fill="#526478">未通过则不进入下一步</text>
      <text x="20" y="180" font-size="16" fill="#344d68">适用：任务可拆成固定步骤，如大纲—检查—正文</text>
      <text x="20" y="203" font-size="16" fill="#526478">代价：调用次数增加，延迟变长</text>
    </g>

    <!-- 2. Routing -->
    <g transform="translate(508 112)">
      <rect width="450" height="216" rx="14" fill="#fff" stroke="#c8d2de"/>
      <text x="20" y="38" font-size="21" font-weight="700" fill="#182b40">路由</text>
      <text x="70" y="38" font-size="16" fill="#526478">Routing</text>
      <g fill="none" stroke="#50647a" stroke-width="1.7">
        <path d="M60 104 H82" marker-end="url(#arrow)"/>
        <path d="M190 104 L238 75" marker-end="url(#arrow)"/>
        <path d="M190 104 H238" marker-end="url(#arrow)"/>
        <path d="M190 104 L238 133" marker-end="url(#arrow)"/>
        <path d="M370 72 L392 96" marker-end="url(#arrow)"/>
        <path d="M370 104 H392" marker-end="url(#arrow)"/>
        <path d="M370 136 L392 112" marker-end="url(#arrow)"/>
      </g>
      <rect x="88" y="86" width="98" height="36" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
      <text x="137" y="110" text-anchor="middle" font-size="17" fill="#254d7a">LLM 分类</text>
      <g fill="#f3f6f9" stroke="#c8d2de">
        <rect x="246" y="57" width="120" height="30" rx="7"/>
        <rect x="246" y="89" width="120" height="30" rx="7"/>
        <rect x="246" y="121" width="120" height="30" rx="7"/>
      </g>
      <g font-size="16" fill="#344d68" text-anchor="middle">
        <text x="306" y="78">退款咨询流程</text>
        <text x="306" y="110">技术支持流程</text>
        <text x="306" y="142">其他类别</text>
      </g>
      <g font-size="17" fill="#526478">
        <text x="20" y="110">输入</text>
        <text x="398" y="110">输出</text>
      </g>
      <text x="20" y="180" font-size="16" fill="#344d68">适用：输入本就分为几类，各走不同提示与工具</text>
      <text x="20" y="203" font-size="16" fill="#526478">前提：分类结果足够可靠</text>
    </g>

    <!-- 3. Parallelization -->
    <g transform="translate(42 344)">
      <rect width="450" height="216" rx="14" fill="#fff" stroke="#c8d2de"/>
      <text x="20" y="38" font-size="21" font-weight="700" fill="#182b40">并行</text>
      <text x="70" y="38" font-size="16" fill="#526478">Parallelization</text>
      <g fill="none" stroke="#50647a" stroke-width="1.7">
        <path d="M58 104 L92 75" marker-end="url(#arrow)"/>
        <path d="M58 104 H92" marker-end="url(#arrow)"/>
        <path d="M58 104 L92 133" marker-end="url(#arrow)"/>
        <path d="M182 72 L228 96" marker-end="url(#arrow)"/>
        <path d="M182 104 H228" marker-end="url(#arrow)"/>
        <path d="M182 136 L228 112" marker-end="url(#arrow)"/>
        <path d="M344 104 H366" marker-end="url(#arrow)"/>
      </g>
      <g fill="#e9f0fb" stroke="#a9bfdc">
        <rect x="98" y="57" width="80" height="30" rx="7"/>
        <rect x="98" y="89" width="80" height="30" rx="7"/>
        <rect x="98" y="121" width="80" height="30" rx="7"/>
      </g>
      <g font-size="16" fill="#254d7a" text-anchor="middle">
        <text x="138" y="78">LLM</text>
        <text x="138" y="110">LLM</text>
        <text x="138" y="142">LLM</text>
      </g>
      <rect x="234" y="86" width="106" height="36" rx="8" fill="#f3f6f9" stroke="#c8d2de"/>
      <text x="287" y="110" text-anchor="middle" font-size="17" fill="#344d68">汇总或投票</text>
      <g font-size="17" fill="#526478">
        <text x="20" y="110">输入</text>
        <text x="372" y="110">输出</text>
      </g>
      <text x="20" y="180" font-size="16" fill="#344d68">分段：独立部分同时执行，减少等待</text>
      <text x="20" y="203" font-size="16" fill="#526478">投票：多次调用同一问题，置信度仍需评测</text>
    </g>

    <!-- 4. Orchestrator-workers -->
    <g transform="translate(508 344)">
      <rect width="450" height="216" rx="14" fill="#fff" stroke="#c8d2de"/>
      <text x="20" y="38" font-size="21" font-weight="700" fill="#182b40">协调者-执行者</text>
      <text x="166" y="38" font-size="16" fill="#526478">Orchestrator-Workers</text>
      <rect x="184" y="52" width="108" height="104" rx="10" fill="none" stroke="#a9bfdc" stroke-dasharray="5 4"/>
      <g fill="none" stroke="#50647a" stroke-width="1.7">
        <path d="M58 104 H74" marker-end="url(#arrow)"/>
        <path d="M158 104 L190 77" marker-end="url(#arrow)"/>
        <path d="M158 104 H190" marker-end="url(#arrow)"/>
        <path d="M158 104 L190 131" marker-end="url(#arrow)"/>
        <path d="M286 74 L316 96" marker-end="url(#arrow)"/>
        <path d="M286 104 H316" marker-end="url(#arrow)"/>
        <path d="M286 134 L316 112" marker-end="url(#arrow)"/>
        <path d="M382 104 H396" marker-end="url(#arrow)"/>
      </g>
      <rect x="80" y="86" width="74" height="36" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
      <text x="117" y="110" text-anchor="middle" font-size="17" fill="#254d7a">协调者</text>
      <g fill="#e9f0fb" stroke="#a9bfdc">
        <rect x="196" y="61" width="84" height="27" rx="6"/>
        <rect x="196" y="91" width="84" height="27" rx="6"/>
        <rect x="196" y="121" width="84" height="27" rx="6"/>
      </g>
      <g font-size="16" fill="#254d7a" text-anchor="middle">
        <text x="238" y="80">执行者</text>
        <text x="238" y="110">执行者</text>
        <text x="238" y="140">执行者</text>
      </g>
      <rect x="322" y="86" width="56" height="36" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
      <text x="350" y="110" text-anchor="middle" font-size="17" fill="#254d7a">整合</text>
      <g font-size="17" fill="#526478">
        <text x="20" y="110">输入</text>
        <text x="400" y="110">输出</text>
      </g>
      <text x="20" y="180" font-size="16" fill="#344d68">适用：子任务无法预先列出，如多文件代码修改</text>
      <text x="20" y="203" font-size="16" fill="#526478">与并行的区别：子任务由协调者按输入拆出</text>
    </g>

    <!-- 5. Evaluator-optimizer -->
    <g transform="translate(42 576)">
      <rect width="450" height="216" rx="14" fill="#fff" stroke="#c8d2de"/>
      <text x="20" y="38" font-size="21" font-weight="700" fill="#182b40">评价-优化</text>
      <text x="132" y="38" font-size="16" fill="#526478">Evaluator-Optimizer</text>
      <g fill="none" stroke="#50647a" stroke-width="1.7">
        <path d="M60 94 H80" marker-end="url(#arrow)"/>
        <path d="M168 94 H226" marker-end="url(#arrow)"/>
        <path d="M314 94 H344" marker-end="url(#arrow)"/>
        <path d="M270 112 V132 H126 V118" marker-end="url(#arrow)"/>
      </g>
      <rect x="86" y="76" width="80" height="36" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
      <rect x="232" y="76" width="80" height="36" rx="8" fill="#fff4df" stroke="#d9c397"/>
      <text x="126" y="100" text-anchor="middle" font-size="17" fill="#254d7a">生成</text>
      <text x="272" y="100" text-anchor="middle" font-size="17" fill="#725025">评价</text>
      <g font-size="15" fill="#526478" text-anchor="middle">
        <text x="197" y="84">候选</text>
        <text x="329" y="84">通过</text>
        <text x="198" y="153">未通过：返回修改意见</text>
      </g>
      <g font-size="17" fill="#526478">
        <text x="20" y="100">输入</text>
        <text x="350" y="100">输出</text>
      </g>
      <text x="20" y="180" font-size="16" fill="#344d68">适用：评价标准明确，反馈能带来可测改进</text>
      <text x="20" y="203" font-size="16" fill="#526478">否则循环可能只是反复润色</text>
    </g>

    <!-- 6. Agent -->
    <g transform="translate(508 576)">
      <rect width="450" height="216" rx="14" fill="#f2f9f5" stroke="#a3cdbb"/>
      <text x="20" y="38" font-size="21" font-weight="700" fill="#182b40">自主 Agent</text>
      <text x="134" y="38" font-size="16" fill="#526478">Agents</text>
      <rect x="326" y="18" width="104" height="28" rx="14" fill="#e7f4ee" stroke="#a3cdbb"/>
      <text x="378" y="38" text-anchor="middle" font-size="15" fill="#21624a">模型定路径</text>
      <g fill="none" stroke="#50647a" stroke-width="1.7">
        <path d="M82 86 H116" marker-end="url(#arrow)"/>
        <path d="M120 102 H86" marker-end="url(#arrow)"/>
        <path d="M228 86 H300" marker-end="url(#arrow)"/>
        <path d="M304 102 H232" marker-end="url(#arrow)"/>
        <path d="M174 112 V134" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
      </g>
      <rect x="20" y="76" width="58" height="36" rx="8" fill="#f3f6f9" stroke="#c8d2de"/>
      <rect x="124" y="76" width="100" height="36" rx="8" fill="#e9f0fb" stroke="#a9bfdc"/>
      <rect x="308" y="76" width="96" height="36" rx="8" fill="#e7f4ee" stroke="#a3cdbb"/>
      <g font-size="17" text-anchor="middle">
        <text x="49" y="100" fill="#344d68">用户</text>
        <text x="174" y="100" fill="#254d7a">LLM 决策</text>
        <text x="356" y="100" fill="#21624a">环境</text>
      </g>
      <g font-size="15" fill="#526478" text-anchor="middle">
        <text x="266" y="76">工具调用</text>
        <text x="266" y="122">执行结果</text>
      </g>
      <text x="186" y="152" font-size="15" fill="#526478">完成、求助或达到迭代上限时停止</text>
      <text x="20" y="180" font-size="16" fill="#344d68">适用：步骤数量与执行路径事先难以确定</text>
      <text x="20" y="203" font-size="16" fill="#526478">依据环境反馈决定下一步，设检查点与终止条件</text>
    </g>

    <text x="500" y="822" text-anchor="middle" font-size="16" fill="#64758a">根据 Anthropic 原文的模式说明重绘；各模式可组合使用，排列顺序不表示复杂度递增</text>
  </g>
</svg>
